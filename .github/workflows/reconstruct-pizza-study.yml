name: Reconstruct pizza study person

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pizza-person-reconstruction
  cancel-in-progress: false

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU reconstruction and Blender
        run: |
          pip install --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir numpy==1.26.4 omegaconf==2.3.0 einops==0.7.0 transformers==4.35.0 trimesh==4.0.5 rembg==2.0.61 onnxruntime==1.20.1 'imageio[ffmpeg]' scikit-image==0.24.0 bpy==4.5.3
      - name: Fetch MIT-licensed TripoSR source and weights
        run: |
          git clone https://github.com/VAST-AI-Research/TripoSR.git /tmp/TripoSR
          git -C /tmp/TripoSR checkout 107cefdc244c39106fa830359024f6a2f1c78871
          mkdir -p /tmp/pizza-weights
          curl -fL --retry 3 https://huggingface.co/stabilityai/TripoSR/resolve/main/config.yaml -o /tmp/pizza-weights/config.yaml
          curl -fL --retry 3 https://huggingface.co/stabilityai/TripoSR/resolve/main/model.ckpt -o /tmp/pizza-weights/model.ckpt
      - name: Reconstruct the custom person
        env:
          OMP_NUM_THREADS: '4'
        run: >-
          python models/pizza-study/reconstruct_cpu.py
          --source /tmp/TripoSR --weights /tmp/pizza-weights
          --image models/pizza-study/person-reference.jpg
          --output models/pizza-study/reconstruction --resolution 256 --threads 4
      - name: Render four inspection angles in Cycles
        run: >-
          python models/pizza-study/inspect_generated.py
          --asset models/pizza-study/reconstruction
          --output models/pizza-study/inspection --samples 24 --size 800
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pizza-person-inspection
          path: |
            models/pizza-study/reconstruction/*.json
            models/pizza-study/reconstruction/*.glb
            models/pizza-study/reconstruction/*.png
            models/pizza-study/inspection/
          retention-days: 14
      - name: Save generated assets for visual review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/pizza-study/reconstruction/person.glb models/pizza-study/reconstruction/input.png models/pizza-study/reconstruction/cutout.png models/pizza-study/reconstruction/reconstruction.json
          git add models/pizza-study/inspection/*.png models/pizza-study/inspection/inspection.json
          if ! git diff --cached --quiet; then
            git commit -m 'Generate pizza-study person and Cycles inspection views [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
