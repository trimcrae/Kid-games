name: Fetch Photo Expedition panoramas

# Finds one free-licensed 360° photograph per expedition on Wikimedia Commons
# (the "Look around for real" viewpoints) and commits it back to the branch.
# Runs when the panorama manifest or the fetch script changes, or by hand.
# the Actions tab. Photos that already exist are skipped unless "force".

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-fetch photos that already exist"
        type: boolean
        default: false
  push:
    paths:
      - "games/photo-expedition/panoramas-manifest.json"
      - "tools/fetch-expedition-panoramas.mjs"

permissions:
  contents: write

concurrency:
  group: expedition-panoramas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  panoramas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch panoramas
        run: node tools/fetch-expedition-panoramas.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - name: Commit panoramas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "games/photo-expedition/panoramas"
          if git diff --cached --quiet; then
            echo "No new panoramas to commit."
          else
            git commit -m "Add Photo Expedition 360° panoramas [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
