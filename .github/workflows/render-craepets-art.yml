name: Render Craepets clay art

# Re-renders the Craepets creatures, egg, petpets and wardrobe with Blender
# (as a Python module, CPU only) from tools/craepets-art/render.py and commits
# the sprite sheets in games/craepets/art/ back to the repo.
#
# The art is entirely code-drawn — spheres, cones and tubes lit like a toy
# photo — so no image model is involved. Sheets that already exist are kept;
# tick "force" to re-render everything (for instance after changing a shape).
#
# Run it from the Actions tab ("Run workflow"), or it runs automatically when
# the render script changes.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-render sheets that already exist"
        type: boolean
        default: false
  push:
    paths:
      - "tools/craepets-art/render.py"
      - ".github/workflows/render-craepets-art.yml"

permissions:
  contents: write

concurrency:
  group: render-craepets-art-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Blender (bpy) and Pillow
        run: pip install "bpy==5.0.*" pillow

      - name: Render the sheets
        run: python3 tools/craepets-art/render.py --samples 64 ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - name: Commit the art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "games/craepets/art"
          if git diff --cached --quiet; then
            echo "No art changes to commit."
          else
            git commit -m "Render Craepets clay art [skip ci]"
            # other bots can land on this branch at once, so pick up
            # anything pushed meanwhile before pushing ours
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
