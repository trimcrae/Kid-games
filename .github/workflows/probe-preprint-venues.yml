name: probe-preprint-venues

# Temporary diagnostic. The dev sandbox's egress proxy blocks scholarly
# metadata APIs and the venue domains, so this runs the checks from a runner
# with open internet. Delete once the questions below are answered.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-preprint-venues.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Venue landing pages reachable?
        run: |
          set +e
          for u in https://aixiv.science/ https://airaxiv.com/ https://jaigp.org/; do
            echo "=== $u"
            curl -sSL -o /dev/null -w "  http=%{http_code} final=%{url_effective}\n" --max-time 30 "$u"
          done

      - name: 'DIAGNOSTIC: aiXiv abs page — DOI and Google Scholar meta tags'
        run: |
          set +e
          U=https://aixiv.science/abs/aixiv.260718.000004
          echo "=== $U"
          curl -sSL --max-time 30 "$U" -o abs.html
          echo "  bytes=$(wc -c < abs.html)"
          echo "--- citation_* / DC / prism meta tags (Scholar eligibility):"
          grep -ioE '<meta[^>]*(citation_[a-z_]+|dc\.[a-z]+|prism\.[a-z]+)[^>]*>' abs.html | head -40
          echo "--- DOI-shaped strings (10.xxxx/...):"
          grep -oE '10\.[0-9]{4,9}/[^"'"'"'< ]+' abs.html | sort -u | head -20
          echo "--- literal mentions of 'doi':"
          grep -ioE '.{0,60}doi.{0,60}' abs.html | head -15

      - name: AiraXiv landing page — same checks
        run: |
          set +e
          curl -sSL --max-time 30 https://airaxiv.com/ -o aira.html
          echo "  bytes=$(wc -c < aira.html)"
          echo "--- citation_* meta tags:"
          grep -ioE '<meta[^>]*citation_[a-z_]+[^>]*>' aira.html | head -20
          echo "--- DOI-shaped strings:"
          grep -oE '10\.[0-9]{4,9}/[^"'"'"'< ]+' aira.html | sort -u | head -20

      - name: Crossref — anything registered by these venues?
        run: |
          set +e
          for q in aiXiv AiraXiv JAIGP; do
            echo "=== crossref query.bibliographic=$q"
            curl -sS --max-time 30 "https://api.crossref.org/works?query.bibliographic=$q&rows=3" \
              | jq -r '"  total-results: \(.message["total-results"])", (.message.items[]? | "  - \(.title[0]? // "untitled") [\(.publisher // "no publisher")] \(.DOI)")'
          done
          echo "=== crossref members named aixiv/airaxiv"
          curl -sS --max-time 30 "https://api.crossref.org/members?query=aixiv" | jq -r '"  total: \(.message["total-results"])", (.message.items[]? | "  - \(.["primary-name"])")'

      - name: DataCite — anything registered?
        run: |
          set +e
          for q in aixiv airaxiv jaigp; do
            echo "=== datacite query=$q"
            curl -sS --max-time 30 "https://api.datacite.org/dois?query=$q&page[size]=3" \
              | jq -r '"  total: \(.meta.total)", (.data[]? | "  - \(.attributes.doi) | \(.attributes.titles[0].title? // "untitled")")'
          done

      - name: OpenAlex — is it a known source, and are works indexed?
        run: |
          set +e
          for q in aixiv airaxiv jaigp; do
            echo "=== openalex sources search=$q"
            curl -sS --max-time 30 "https://api.openalex.org/sources?search=$q" \
              | jq -r '"  count: \(.meta.count)", (.results[]? | "  - \(.display_name) | works=\(.works_count) | \(.id)")'
          done
          echo "=== openalex works mentioning aixiv"
          curl -sS --max-time 30 "https://api.openalex.org/works?search=aixiv&per-page=3" \
            | jq -r '"  count: \(.meta.count)", (.results[]? | "  - \(.display_name) | \(.primary_location.source.display_name? // "no source")")'

      - name: Google Scholar robots/indexability hints
        run: |
          set +e
          for h in aixiv.science airaxiv.com; do
            echo "=== https://$h/robots.txt"
            curl -sSL --max-time 20 "https://$h/robots.txt" | head -20
          done
