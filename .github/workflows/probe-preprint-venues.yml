name: probe-preprint-venues

# Temporary diagnostic. The dev sandbox's egress proxy blocks scholarly
# metadata APIs and the venue domains, so this runs the checks from a runner
# with open internet. Delete once the questions below are answered.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-preprint-venues.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: DataCite (--globoff; v1 had a curl bracket-glob bug)
        run: |
          set +e
          for q in aixiv airaxiv jaigp "aiXiv"; do
            echo "=== datacite query=$q"
            curl -sS --globoff --max-time 30 "https://api.datacite.org/dois?query=$q&page[size]=5" \
              | jq -r '"  total: \(.meta.total // "ERR")", (.data[]? | "  - \(.attributes.doi) | \(.attributes.publisher? // "?") | \(.attributes.titles[0].title? // "untitled")")'
          done

      - name: AiraXiv PAPER page meta tags (v1 only checked the homepage)
        run: |
          set +e
          echo "=== discover a paper URL"
          curl -sSL --max-time 30 https://airaxiv.com/papers/ -o list.html
          echo "  bytes=$(wc -c < list.html)"
          grep -oE '/papers/view/[A-Za-z0-9._/-]+' list.html | sort -u | head -5
          P=$(grep -oE '/papers/view/[A-Za-z0-9._/-]+' list.html | head -1)
          echo "  chosen: $P"
          if [ -n "$P" ]; then
            curl -sSL --max-time 30 "https://airaxiv.com$P" -o paper.html
            echo "  bytes=$(wc -c < paper.html)"
            echo "--- citation_* meta tags:"
            grep -ioE '<meta[^>]*(citation_[a-z_]+|dc\.[a-z]+)[^>]*>' paper.html | head -30
            echo "--- DOI-shaped strings:"
            grep -oE '10\.[0-9]{4,9}/[^"'"'"'< ]+' paper.html | sort -u | head -10
            echo "--- literal 'doi' mentions:"
            grep -ioE '.{0,50}doi.{0,50}' paper.html | head -10
          fi

      - name: Scale — how many papers does each actually host?
        run: |
          set +e
          echo "=== aiXiv sitemap"
          curl -sSL --max-time 30 https://aixiv.science/sitemap.xml -o sm.xml
          echo "  bytes=$(wc -c < sm.xml)"
          echo "  <loc> entries: $(grep -oc '<loc>' sm.xml)"
          echo "  /abs/ entries: $(grep -o '/abs/[^<]*' sm.xml | sort -u | wc -l)"
          echo "  newest few:"
          grep -o '/abs/[^<]*' sm.xml | sort -u | tail -5
          echo "=== airaxiv sitemap (if any)"
          curl -sSL --max-time 30 https://airaxiv.com/sitemap.xml -o sm2.xml
          echo "  bytes=$(wc -c < sm2.xml)"
          echo "  <loc> entries: $(grep -oc '<loc>' sm2.xml)"

      - name: Semantic Scholar — any records from these venues?
        run: |
          set +e
          for q in aiXiv AiraXiv; do
            echo "=== s2 venue search $q"
            curl -sS --globoff --max-time 30 \
              "https://api.semanticscholar.org/graph/v1/paper/search?query=$q&limit=3&fields=title,venue,externalIds" \
              | jq -r '"  total: \(.total // "ERR")", (.data[]? | "  - \(.title) | venue=\(.venue // "none")")'
          done

      - name: The paper that asks this exact question
        run: |
          set +e
          echo "=== Health Affairs Scholar: bibliometric acceptance of aiXiv preprints"
          curl -sS --max-time 30 "https://api.crossref.org/works/10.1093/haschl/qxag064" \
            | jq -r '.message | "  title: \(.title[0])", "  published: \(.published["date-parts"][0] | join("-"))", "  container: \(."container-title"[0]? // "?")", "  abstract: \(.abstract // "none in metadata")"'

      - name: Does aiXiv expose an agent/submission API?
        run: |
          set +e
          for u in https://aixiv.science/api https://aixiv.science/docs https://aixiv.science/aisc2026/ https://airaxiv.com/mcp/ https://airaxiv.com/users/api-keys/; do
            printf "%-45s " "$u"
            curl -sSL -o /dev/null -w "http=%{http_code} final=%{url_effective}\n" --max-time 20 "$u"
          done
