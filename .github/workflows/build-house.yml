name: Rebuild house model and walkthrough
on:
  workflow_dispatch:
    inputs:
      views:
        description: 'Preview cameras to re-render (comma-separated, e.g. lower_entry,lower_bathroom). Empty renders every preview.'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: house-export-${{ github.ref }}
  cancel-in-progress: false
jobs:
  house:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ephemeral Blender runtime
        run: |
          python -c "import shutil; free=shutil.disk_usage('.').free; budget=3*1024**3; print(f'Free {free/1024**3:.1f} GiB; runtime/output budget 3 GiB'); assert free-budget >= 10*1024**3, 'Insufficient storage headroom'"
          pip install --no-cache-dir bpy==4.5.3 pillow
      - name: Build editable model and changed previews
        env:
          VIEWS: ${{ inputs.views }}
        run: |
          extra=()
          if [ -n "$VIEWS" ]; then
            [[ "$VIEWS" =~ ^[a-z_]+(,[a-z_]+)*$ ]] || { echo "Invalid views: $VIEWS"; exit 1; }
            extra=(--views "$VIEWS")
          fi
          python models/house/build.py -- --render --samples 8 --preview-scale 50 "${extra[@]}"
      - name: Export and verify geometry
        run: |
          python models/house/export_walkthrough.py -- --ao
          python models/house/verify.py
          node models/house/test_walkthrough.mjs
          node tests/house-routes.mjs
          node tests/house-camera-clearance.mjs
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/house/house.blend models/house/inventory.json models/house/previews/ house-test/house.json house-test/house.mesh.gz house-test/house.ao.gz
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild house layout and browser geometry [house-export]'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
