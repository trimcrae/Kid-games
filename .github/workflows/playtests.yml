name: Focused playtests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playtests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-latest
    # Browser/system-package downloads can take several minutes before the
    # ~10-minute suite starts. Individual suite timeouts still catch hangs.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependency
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install Chromium
        # The next step selects full Chromium explicitly, so a separate
        # headless-shell download is unnecessary.
        run: node node_modules/playwright-core/cli.js install --with-deps --no-shell chromium
      - name: Select installed Chromium
        run: |
          node -e 'const { chromium } = require("playwright-core"); const fs = require("node:fs"); const executable = chromium.executablePath(); fs.accessSync(executable, fs.constants.X_OK); fs.appendFileSync(process.env.GITHUB_ENV, `CHROMIUM_PATH=${executable}\n`);'
      # Fail early on the new game and make its screenshots available while
      # the broader arcade gate continues. The aggregate gate still runs all suites.
      - name: Check Sudoku interactions
        run: npm run test:regressions -- sudoku-engine.mjs sudoku-browser.cjs
      - name: Keep Sudoku layout previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-layout-previews
          path: /tmp/sudoku-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Run focused regressions
        run: npm run test:regressions
      - name: Retain house upholstery visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: house-upholstery-visuals
          path: /tmp/house-upholstery-visuals/
          if-no-files-found: ignore
          retention-days: 7
