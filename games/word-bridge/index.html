<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌉 Word Bridge</title>
  <meta name="description" content="Answer the question, and every letter of your answer becomes a plank — walk your bridge across the canyon before the bot does!" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌉</text></svg>" />
  <meta name="theme-color" content="#ff9f45" />
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <style>
    .wb-wrap { max-width: 760px; margin: 0 auto; padding: 0 0.75rem 3rem; }
    .hero { padding: 0.25rem 1rem 0.5rem; }

    /* --- pickers --- */
    .pick-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.45rem; margin-bottom: 0.6rem; }
    .pick {
      font-family: var(--font); font-weight: bold; font-size: 0.98rem;
      border: 3px solid var(--pc, var(--purple)); background: #fff; color: var(--ink);
      border-radius: 999px; padding: 0.35rem 0.9rem; cursor: pointer;
      box-shadow: 0 4px 10px rgba(43,36,64,0.12);
      transition: transform 0.12s ease; touch-action: manipulation;
    }
    .pick:hover { transform: translateY(-2px); }
    .pick .face { height: 1.5rem; width: auto; vertical-align: -0.4rem; margin-right: 0.25rem; image-rendering: pixelated; }
    .pick.on {
      background: var(--pc, var(--purple)); color: #fff;
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 0 0 3px #fff, 0 6px 14px rgba(43,36,64,0.25);
    }

    /* ===========================================================
       THE CANYON — one canvas, drawn by stage.js
       =========================================================== */
    .scene {
      position: relative; width: 100%; height: clamp(250px, 48vw, 360px);
      border-radius: 20px; overflow: hidden; margin-bottom: 0.8rem;
      background: #123449; box-shadow: inset 0 0 0 3px rgba(255,255,255,0.35);
      touch-action: manipulation;
    }
    .scene canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

    .hud {
      position: absolute; left: 0; right: 0; top: 0; display: flex;
      justify-content: space-between; padding: 0.45rem 0.7rem;
      font-weight: bold; font-size: 0.9rem; color: #fff;
      text-shadow: 0 2px 3px rgba(0,0,0,0.5); pointer-events: none;
    }
    .hud .bot-side { color: #ffd166; }

    /* The racers can't both be on camera (one is behind you), so the
       bars keep the race readable at a glance. */
    .prog {
      position: absolute; left: 10px; right: 10px; top: 1.75rem;
      display: flex; flex-direction: column; gap: 3px; pointer-events: none;
    }
    .prog span { display: block; height: 6px; border-radius: 999px; background: rgba(0,0,0,0.3); overflow: hidden; }
    .prog i { display: block; height: 100%; width: 0; border-radius: 999px; transition: width 0.5s ease; }
    .prog .you i { background: linear-gradient(90deg, var(--pink), var(--yellow)); }
    .prog .bot i { background: #d7e3ec; }

    /* ===========================================================
       THE PROMPT MODAL
       =========================================================== */
    .modal {
      position: fixed; inset: 0; z-index: 30; display: flex;
      align-items: center; justify-content: center; padding: 1rem;
      background: rgba(43,36,64,0.5);
    }
    .modal[hidden] { display: none; }
    .modal-card {
      background: var(--paper); border-radius: 22px; padding: 1rem 0.9rem 1.1rem;
      width: 100%; max-width: 520px; text-align: center;
      box-shadow: 0 22px 50px rgba(43,36,64,0.4);
      animation: modal-in 0.25s ease;
      max-height: 92vh; overflow-y: auto;
    }
    @keyframes modal-in { from { opacity: 0; transform: translateY(18px) scale(0.95); } }

    .q-emoji { font-size: 2.3rem; line-height: 1.1; }
    .q-text { font-size: clamp(1.05rem, 4.4vw, 1.5rem); font-weight: 900; color: var(--purple); margin: 0.1rem 0 0.15rem; }
    .q-hint { color: #6a6385; font-size: 0.9rem; margin: 0 0 0.5rem; }

    .timer { height: 10px; border-radius: 999px; background: #eee7fb; overflow: hidden; margin: 0.4rem 0 0.7rem; }
    .timer > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--green), var(--yellow)); transition: width 0.1s linear; }
    .timer.low > i { background: linear-gradient(90deg, var(--yellow), var(--pink)); }

    .answer-form { display: flex; gap: 0.4rem; justify-content: center; flex-wrap: wrap; }
    .answer-form input {
      font-family: var(--font); font-size: 1.25rem; font-weight: bold; text-align: center;
      color: var(--ink); background: #faf7ff; border: 3px solid var(--purple);
      border-radius: 14px; padding: 0.55rem 0.7rem; width: min(300px, 58vw); min-width: 0;
    }
    .answer-form input:focus { outline: none; border-color: var(--pink); }

    .taps { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.5rem; }
    .tap {
      font-family: var(--font); font-weight: 900; font-size: 1.02rem; color: var(--ink);
      background: #fff; border: 4px solid var(--blue); border-radius: 16px;
      padding: 0.55rem 0.4rem; cursor: pointer; box-shadow: 0 5px 0 rgba(56,182,255,0.35);
      touch-action: manipulation; transition: transform 0.12s ease;
    }
    .tap .te { display: block; font-size: 2rem; line-height: 1.15; }
    .tap:hover { transform: translateY(-3px); }
    .tap.used { opacity: 0.45; }

    .feedback { min-height: 1.9rem; margin: 0.6rem 0 0; font-weight: bold; font-size: 1rem; color: #e08b1a; }
    .feedback b { color: var(--purple); }
    .race-line { margin: 0.5rem 0 0; font-size: 0.9rem; color: #6a6385; }
    .race-line b { color: var(--blue); }

    .btn {
      font-family: var(--font); font-size: 1rem; font-weight: bold; color: #fff;
      background: linear-gradient(90deg, var(--green), #2bbf6e); border: none;
      border-radius: 999px; padding: 0.6rem 1.2rem; cursor: pointer;
      box-shadow: 0 8px 18px rgba(61,220,132,0.3); touch-action: manipulation;
      transition: transform 0.14s ease;
    }
    .btn:hover { transform: scale(1.04); }
    .btn.ghost { background: var(--paper); color: var(--purple); box-shadow: 0 6px 14px rgba(43,36,64,0.12); }
    .btn.small { font-size: 0.9rem; padding: 0.45rem 0.9rem; }

    .bar { display: flex; justify-content: center; align-items: center; gap: 0.8rem; flex-wrap: wrap; margin: 0.2rem 0 0.5rem; font-weight: bold; color: var(--purple); }
    .bar b { color: var(--pink); }
    .bar .coin { display: inline-block; vertical-align: -0.25rem; margin-right: 0.2rem; }
    .bar .coin canvas { display: block; image-rendering: pixelated; }
    .win-panel .big canvas { image-rendering: pixelated; }

    /* --- shop --- */
    .shop { display: none; background: #fffdf5; border: 3px dashed var(--yellow); border-radius: 18px; padding: 0.8rem; margin-top: 0.7rem; }
    .shop.open { display: block; }
    .shop h3 { margin: 0 0 0.5rem; color: #e08b1a; }
    .skins { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.5rem; }
    .skin-card {
      font-family: var(--font); font-weight: bold; font-size: 0.95rem; color: var(--ink);
      background: #fff; border: 3px solid #ffd166; border-radius: 14px; padding: 0.5rem 0.4rem;
      cursor: pointer; touch-action: manipulation;
    }
    .skin-card .swatch { display: block; width: 100%; height: 16px; border-radius: 4px; margin-bottom: 0.35rem;
      object-fit: cover; image-rendering: pixelated; }
    .skin-card.owned { border-color: var(--green); }
    .skin-card.on { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(138,92,255,0.25); }
    .skin-card.locked { opacity: 0.75; }

    .win-panel .big { font-size: 3rem; line-height: 1.2; }
    .win-panel h2 { margin: 0.2rem 0; color: var(--pink); font-size: 1.45rem; }
    .win-panel p { color: #6a6385; margin: 0.3rem 0 0.8rem; }
    .win-panel .words { font-size: 0.9rem; }

    @media (max-width: 480px) {
      .back-link { margin: 0.6rem 0.8rem; padding: 0.45rem 0.9rem; font-size: 0.95rem; }
      .hero { padding: 0 1rem 0.35rem; }
      .subtitle { display: none; }
      .pick { font-size: 0.88rem; padding: 0.3rem 0.75rem; }
      .bar { font-size: 0.92rem; gap: 0.5rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .plk.drop, .mover.step, .modal-card { animation: none; }
      .world, .mover, .island { transition: none; }
    }
  </style>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-1"></span><span class="blob blob-2"></span><span class="blob blob-3"></span>
  </div>

  <a class="back-link" href="../../">← Back to the Arcade</a>

  <header class="hero">
    <h1 class="title"><span class="emo">🌉</span> Word Bridge</h1>
    <p class="subtitle">Every letter you answer with is another plank — walk it to the island!</p>
  </header>

  <main class="wb-wrap">
    <div class="pick-row" id="kid-row"></div>
    <div class="pick-row" id="opt-row"></div>

    <section class="scene" id="scene">
      <canvas id="stage"></canvas>
      <div class="hud" id="hud"></div>
      <div class="prog" aria-hidden="true">
        <span class="you"><i id="prog-you"></i></span>
        <span class="bot"><i id="prog-bot"></i></span>
      </div>
    </section>

    <p class="bar" id="bar"></p>

    <div class="pick-row">
      <button class="btn ghost small" id="shop-btn" type="button">Bridge shop</button>
      <button class="btn ghost small" id="restart-btn" type="button">New race</button>
    </div>

    <section class="shop" id="shop">
      <h3>Bridge shop</h3>
      <div class="skins" id="skins"></div>
    </section>
  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-live="polite" hidden>
    <div class="modal-card" id="modal-card"></div>
  </div>

  <script src="../../assets/js/sfx.js"></script>
  <script src="../../assets/js/confetti.js"></script>
  <script src="sprites.js"></script>
  <script src="stage.js"></script>
  <script src="data.js"></script>
  <script src="word-bridge.js"></script>
</body>
</html>
