<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🟩 Word Guess</title>
  <meta name="description" content="Guess the secret word in 6 tries — a kid-friendly Wordle with four levels, a Word of the Day, hints and word meanings." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🟩</text></svg>" />
  <meta name="theme-color" content="#8a5cff" />
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <style>
    .btn {
      font-family: var(--font); font-size: 1.05rem; font-weight: bold; color: #fff;
      background: linear-gradient(90deg, var(--green), #2bbf6e);
      border: none; border-radius: 999px; padding: 0.7rem 1.4rem; cursor: pointer;
      box-shadow: 0 8px 20px rgba(61,220,132,0.35); transition: transform 0.15s ease; touch-action: manipulation;
      min-height: 48px;
    }
    .btn:hover { transform: scale(1.05); }
    .btn.ghost { background: var(--paper); color: #2bbf6e; box-shadow: 0 6px 16px rgba(43,36,64,0.12); }
    .btn:disabled { opacity: 0.45; cursor: default; transform: none; }
    button:focus-visible, .back-link:focus-visible { outline: 4px solid var(--purple); outline-offset: 3px; }

    .sr-only {
      position:absolute; width:1px; height:1px; padding:0; margin:-1px;
      overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
    }

    .wg-bar { display:flex; justify-content:center; gap:1.2rem; font-size:1rem; font-weight:bold; color:#2bbf6e; margin-bottom:0.35rem; flex-wrap:wrap; }
    .wg-bar b { color: var(--pink); }

    .hint { min-height:1.6rem; font-size:1.05rem; font-weight:bold; color:var(--purple); margin:0.2rem 0; line-height:1.35; }
    .hint.meaning { color: var(--ink); background: rgba(255,255,255,0.72); border-radius: 14px; padding: 0.45rem 0.7rem; }
    .hint.meaning b { color: var(--purple); }
    .feedback { min-height:1.4rem; font-size:1.05rem; font-weight:bold; color:var(--green); margin:0 0 0.4rem; line-height:1.3; }

    /* ---------- board ---------- */
    .grid { display:grid; grid-template-rows:repeat(6,1fr); gap:0.35rem; width:min(300px, 86vw); margin:0.4rem auto 0.5rem; }
    .row { display:grid; grid-template-columns:repeat(5,1fr); gap:0.35rem; }
    .cell {
      position:relative; aspect-ratio:1/1; border-radius:12px; background:rgba(255,255,255,0.7);
      box-shadow: inset 0 0 0 3px rgba(138,92,255,0.18);
      display:flex; align-items:center; justify-content:center;
      font-size:1.6rem; font-weight:bold; text-transform:uppercase; color:var(--ink);
    }
    .cell.filled { box-shadow: inset 0 0 0 3px rgba(138,92,255,0.5); }
    /* colour AND a shape, so the clue still reads if you can't tell green from yellow */
    .cell.correct { background:#2f9e5e; color:#fff; box-shadow:none; }
    .cell.present { background:#d99a12; color:#fff; box-shadow:none; }
    .cell.absent  { background:#6f6980; color:#fff; box-shadow:none; }
    .cell[data-mark]::after {
      content: attr(data-mark); position:absolute; top:1px; right:4px;
      font-size:0.72rem; line-height:1; opacity:0.95; font-weight:bold;
    }
    .row.bad { animation: shake 0.4s ease; }
    .cell.flip { animation: flip 0.5s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 60%{transform:translateX(8px);} }
    @keyframes flip { 0%{transform:rotateX(0);} 50%{transform:rotateX(90deg);} 100%{transform:rotateX(0);} }

    .legend { display:flex; justify-content:center; gap:0.7rem; flex-wrap:wrap; font-size:0.78rem; font-weight:bold; color:var(--ink); opacity:0.8; margin:0 0 0.4rem; }
    .legend span::before { display:inline-block; width:1.1rem; height:1.1rem; line-height:1.1rem; text-align:center; border-radius:5px; color:#fff; margin-right:0.25rem; font-size:0.72rem; vertical-align:-2px; }
    .legend .lg-c::before { content:"✔"; background:#2f9e5e; }
    .legend .lg-p::before { content:"↔"; background:#d99a12; }
    .legend .lg-a::before { content:"✖"; background:#6f6980; }

    /* ---------- detective / strategy coach ---------- */
    .coach {
      display:flex; flex-wrap:wrap; justify-content:center; gap:0.35rem 0.6rem;
      background:rgba(255,255,255,0.66); border-radius:14px; padding:0.45rem 0.6rem;
      margin:0 auto 0.6rem; max-width:520px; font-size:0.85rem; font-weight:bold; color:var(--ink); min-height:1.9rem;
    }
    .coach .c-known { color:#2f9e5e; letter-spacing:0.14em; }
    .coach .c-in { color:#b57c05; }
    .coach .c-out { color:#6f6980; }
    .coach .c-left { color:var(--purple); }
    .coach .coach-tip { color:var(--purple); font-weight:bold; letter-spacing:0; }

    /* ---------- keyboard ---------- */
    .kb { max-width:520px; margin:0 auto 0.8rem; display:flex; flex-direction:column; gap:0.35rem; }
    .kb-row { display:flex; justify-content:center; gap:0.28rem; }
    .key {
      position:relative; flex:1 1 auto; min-width:0; max-width:2.5rem; height:3rem; border:none; border-radius:9px;
      background:#e9e3f7; color:var(--ink); font-family:var(--font); font-size:1.05rem; font-weight:bold;
      text-transform:uppercase; cursor:pointer; touch-action:manipulation; padding:0;
      transition: transform 0.08s ease;
    }
    .key:active { transform: scale(0.9); }
    .key.wide { max-width:4.4rem; font-size:0.8rem; flex:1.7 1 auto; }
    .key.correct { background:#2f9e5e; color:#fff; }
    .key.present { background:#d99a12; color:#fff; }
    .key.absent  { background:#6f6980; color:#fff; }
    .key[data-mark]::after {
      content: attr(data-mark); position:absolute; top:1px; right:3px; font-size:0.6rem; line-height:1; opacity:0.95;
    }

    .controls { display:flex; justify-content:center; gap:0.5rem; flex-wrap:wrap; }

    /* ---------- tier + mode pickers ---------- */
    .tier-row, .mode-row { display:flex; justify-content:center; gap:0.4rem; flex-wrap:wrap; margin:0.25rem 0; }
    .mode-btn {
      font-family:var(--font); font-size:0.9rem; font-weight:bold; color:#2bbf6e;
      background:var(--paper); border:3px solid transparent; border-radius:999px;
      padding:0.45rem 0.85rem; cursor:pointer; box-shadow:0 4px 12px rgba(43,36,64,0.12);
      touch-action:manipulation; min-height:44px;
    }
    .mode-btn.on { background:var(--green); color:#fff; border-color:#2bbf6e; }
    .mode-btn.mode-day.on { background:var(--purple); border-color:#6c3fe0; }
    .mode-note { font-size:0.8rem; font-weight:bold; color:var(--purple); opacity:0.9; margin:0.1rem 0 0.4rem; min-height:1.1rem; }

    /* ---------- stats panel ---------- */
    .overlay {
      position:fixed; inset:0; background:rgba(43,36,64,0.55); display:none;
      align-items:center; justify-content:center; padding:1rem; z-index:20;
    }
    .overlay.open { display:flex; }
    .sheet {
      background:var(--paper); border-radius:22px; padding:1.1rem 1.2rem 1.3rem; max-width:400px; width:100%;
      box-shadow:0 20px 50px rgba(43,36,64,0.35); max-height:88vh; overflow:auto; text-align:center;
    }
    .sheet h2 { margin:0 0 0.6rem; color:var(--purple); font-size:1.3rem; }
    .sheet h3 { margin:0.9rem 0 0.4rem; color:var(--ink); font-size:0.95rem; }
    .stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:0.4rem; }
    .stat-grid b { display:block; font-size:1.4rem; color:var(--purple); }
    .stat-grid span { font-size:0.7rem; color:var(--ink); opacity:0.75; }
    .bar-row { display:flex; align-items:center; gap:0.4rem; margin:0.22rem 0; }
    .bar-n { width:1rem; font-weight:bold; color:var(--ink); font-size:0.85rem; }
    .bar {
      background:#2f9e5e; color:#fff; font-weight:bold; font-size:0.78rem; text-align:right;
      padding:0.18rem 0.4rem; border-radius:6px; min-width:1.6rem;
    }
    .stat-daily { font-size:0.85rem; color:var(--ink); margin:0.8rem 0 0.2rem; }

    .sparkle { position:fixed; font-size:1.5rem; pointer-events:none; animation:sparkle-up 0.9s ease-out forwards; z-index:5; }
    @keyframes sparkle-up { 0%{opacity:1;transform:translateY(0) scale(0.6);} 100%{opacity:0;transform:translateY(-90px) scale(1.4) rotate(40deg);} }

    /* ---------- small screens: board AND keyboard on one phone screen ---------- */
    @media (max-width: 560px) {
      .back-link { margin: 0.6rem 0.8rem; padding: 0.45rem 0.9rem; font-size: 0.9rem; }
      .game-stage { padding: 0.4rem 0.5rem 1rem; margin-bottom: 1rem; }
      .hero { padding: 0.1rem 0.5rem 0.2rem !important; }
      .title { font-size: 1.45rem; }
      .subtitle { display: none; }
      .wg-bar { gap: 0.7rem; font-size: 0.85rem; margin-bottom: 0.2rem; }
      .tier-row, .mode-row { gap: 0.25rem; margin: 0.15rem 0; flex-wrap: nowrap; }
      .mode-btn { font-size: 0.7rem; padding: 0.35rem 0.4rem; min-height: 44px; letter-spacing: -0.01em; }
      .mode-note { font-size: 0.7rem; margin: 0.1rem 0 0.2rem; min-height: 0.9rem; }
      .hint { font-size: 0.95rem; min-height: 1.3rem; margin: 0.1rem 0; }
      .feedback { font-size: 0.9rem; min-height: 1.2rem; margin: 0 0 0.2rem; }
      .grid { width: min(238px, 66vw); gap: 0.28rem; margin: 0.2rem auto 0.35rem; }
      .cell { font-size: 1.3rem; border-radius: 10px; }
      .legend { font-size: 0.7rem; gap: 0.5rem; margin-bottom: 0.3rem; }
      .coach { font-size: 0.76rem; padding: 0.35rem 0.45rem; margin-bottom: 0.4rem; min-height: 1.6rem; }
      .kb { margin-bottom: 0.5rem; gap: 0.28rem; }
      .key { height: 2.85rem; font-size: 0.95rem; }
      .btn { font-size: 0.9rem; padding: 0.55rem 0.9rem; min-height: 46px; }
    }

    /* laptop screens: trim the hero so the board and keyboard sit closer together */
    @media (min-width: 561px) and (max-height: 900px) {
      .hero { padding: 0.2rem 1rem 0.2rem !important; }
      .title { font-size: 2.2rem; }
      .subtitle { font-size: 0.95rem; margin: 0.1rem 0 0.3rem; }
      .game-stage { padding: 0.4rem 1rem 1rem; }
      .grid { width: min(268px, 60vw); margin: 0.3rem auto 0.4rem; }
      .coach { margin-bottom: 0.45rem; }
    }

    @media (prefers-reduced-motion: reduce){
      .row.bad,.cell.flip,.sparkle{animation:none;}
      .sparkle{display:none;}
      .btn:hover{transform:none;}
      .key:active{transform:none;}
    }
  </style>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-1"></span><span class="blob blob-2"></span><span class="blob blob-3"></span>
  </div>

  <a class="back-link" href="../../">← Back to the Arcade</a>

  <header class="hero" style="padding-top: 0.5rem;">
    <h1 class="title"><span class="emo">🟩</span> Word Guess</h1>
    <p class="subtitle">Guess the secret word in 6 tries — then find out what it means!</p>
  </header>

  <main class="game-stage" style="max-width: 620px;">
    <div class="wg-bar">
      <div>🔥 <span id="streak-label">Streak</span>: <b id="streak">0</b></div>
      <div>⭐ Best: <b id="best">0</b></div>
      <div>🏆 Wins: <b id="wins">0</b></div>
    </div>

    <div class="tier-row" role="group" aria-label="Word level">
      <button class="mode-btn" id="easy-btn"   type="button" aria-pressed="false">🐣 Easy<span class="sr-only"> — 4 letters</span></button>
      <button class="mode-btn" id="normal-btn" type="button" aria-pressed="true">🟩 Normal<span class="sr-only"> — 5 letters</span></button>
      <button class="mode-btn" id="tricky-btn" type="button" aria-pressed="false">📚 Big Kid<span class="sr-only"> — 5 letters, harder words</span></button>
      <button class="mode-btn" id="grown-btn"  type="button" aria-pressed="false">👑 Grown-up<span class="sr-only"> — 5 letters, adult words</span></button>
    </div>

    <div class="mode-row" role="group" aria-label="Puzzle mode">
      <button class="mode-btn" id="practice-btn" type="button" aria-pressed="true">♾️ Practice</button>
      <button class="mode-btn mode-day" id="daily-btn" type="button" aria-pressed="false">🗓️ Word of the Day</button>
    </div>
    <p class="mode-note" id="mode-note"></p>

    <div class="hint" id="hint" aria-live="polite"></div>
    <p class="feedback" id="feedback" aria-live="polite"></p>

    <div class="grid" id="grid" role="grid" aria-label="Guess board"></div>

    <div class="legend" aria-hidden="true">
      <span class="lg-c">right spot</span>
      <span class="lg-p">wrong spot</span>
      <span class="lg-a">not in the word</span>
    </div>

    <div class="coach" id="coach" aria-live="polite"></div>

    <div class="kb" id="kb" role="group" aria-label="On-screen keyboard"></div>

    <div class="controls">
      <button class="btn ghost" id="hint-btn" type="button">💡 Hint</button>
      <button class="btn" id="new-btn" type="button">🔄 New word</button>
      <button class="btn ghost" id="stats-btn" type="button">📊 Stats</button>
    </div>

    <p class="sr-only" id="live" aria-live="polite"></p>
  </main>

  <div class="overlay" id="stats-panel" role="dialog" aria-modal="true" aria-label="Your Word Guess stats" hidden>
    <div class="sheet">
      <h2>📊 Your Word Guess stats</h2>
      <div id="stats-body"></div>
      <p style="margin-top:1rem;"><button class="btn" id="stats-close" type="button">Back to the game</button></p>
    </div>
  </div>

  <script src="../../assets/js/sfx.js"></script>
  <script src="../../assets/js/confetti.js"></script>
  <script src="dictionary.js"></script>
  <script src="words.js"></script>
  <script src="word-guess.js"></script>
</body>
</html>
