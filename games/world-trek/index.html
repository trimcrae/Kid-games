<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌍 World Trek</title>
  <meta name="description" content="Tap the continents and oceans on a pixel world map, find all 50 states on the puzzle map, learn their capitals, and read a fact about every one." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>" />
  <meta name="theme-color" content="#8a5cff" />
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <style>
    /* ---------- mode picker ---------- */
    .modes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.45rem;
      padding: 0 0.75rem;
      margin: 0 auto 0.7rem;
      max-width: 760px;
    }
    .mode-btn {
      font-family: var(--font);
      font-size: 1rem;
      font-weight: bold;
      color: var(--purple);
      background: var(--paper);
      border: 3px solid var(--blue);
      border-radius: 16px;
      padding: 0.45rem 0.8rem;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.12s ease;
    }
    .mode-btn:hover { transform: translateY(-2px); }
    .mode-btn[aria-pressed="true"] {
      color: #fff;
      background: linear-gradient(90deg, var(--blue), var(--purple));
      border-color: var(--purple);
    }

    .stage { max-width: 760px; margin: 0 auto 2.5rem; padding: 0 0.75rem; }

    .prompt-card {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 22px;
      padding: 0.8rem 1rem;
      box-shadow: 0 8px 22px rgba(43, 36, 64, 0.12);
      text-align: center;
    }
    .prompt-card h2 { margin: 0 0 0.3rem; font-size: 1.35rem; color: var(--purple); }
    .prompt-card p  { margin: 0; color: var(--ink); font-size: 1.02rem; min-height: 1.3em; }
    .prompt-card .row { margin-top: 0.6rem; }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      align-items: center;
    }

    .btn {
      font-family: var(--font);
      font-size: 1.02rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(90deg, var(--pink), var(--purple));
      border: none;
      border-radius: 999px;
      padding: 0.55rem 1.2rem;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(138, 92, 255, 0.28);
      transition: transform 0.15s ease;
      touch-action: manipulation;
    }
    .btn:hover { transform: scale(1.04); }
    .btn.ghost {
      color: var(--purple);
      background: var(--paper);
      border: 3px solid var(--purple);
      box-shadow: 0 6px 14px rgba(43, 36, 64, 0.12);
    }

    .scorebar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      font-weight: bold;
      color: var(--purple);
      margin: 0.6rem 0 0.4rem;
      font-size: 1.02rem;
    }
    .scorebar span { color: var(--pink); }

    /* ---------- the pixel world map ---------- */
    .map-card {
      background: rgba(255, 255, 255, 0.6);
      border-radius: 22px;
      padding: 0.5rem;
      box-shadow: 0 8px 22px rgba(43, 36, 64, 0.1);
      margin-top: 0.5rem;
    }
    #world {
      position: relative;
      display: grid;
      grid-template-columns: repeat(48, 1fr);
      grid-template-rows: repeat(22, 1fr);
      aspect-ratio: 48 / 22;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      touch-action: manipulation;
    }
    .wcell { display: block; }
    .wcell.lit { box-shadow: inset 0 0 0 100px rgba(255, 255, 255, 0.55); }
    .wcell.wrong { box-shadow: inset 0 0 0 100px rgba(226, 59, 59, 0.45); }

    .map-labels {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .map-labels b {
      position: absolute;
      transform: translate(-50%, -50%);
      font-size: clamp(0.5rem, 1.5vw, 0.85rem);
      color: #2b2440;
      text-shadow: 0 1px 0 #fff, 0 0 5px #fff;
      white-space: nowrap;
    }

    /* ---------- the states puzzle map ---------- */
    #states {
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      gap: 0.3rem;
      width: 100%;
    }
    .scell {
      font-family: var(--font);
      font-weight: 900;
      font-size: clamp(0.6rem, 2.1vw, 1.05rem);
      color: #2b2440;
      border: none;
      border-radius: 8px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s ease;
      padding: 0;
    }
    .scell:hover { transform: scale(1.08); }
    .scell.blank { background: transparent; cursor: default; }
    .scell.blank:hover { transform: none; }
    .scell.lit  { box-shadow: 0 0 0 3px #2b2440 inset; transform: scale(1.12); }
    .scell.good { background: var(--green) !important; color: #fff; }
    .scell.bad  { background: #ff7a7a !important; color: #fff; }

    /* ---------- legend ---------- */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: center;
      margin: 0.55rem 0 0;
      font-size: 0.85rem;
      font-weight: bold;
      color: #6a6385;
    }
    .legend b {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: var(--paper);
      border-radius: 999px;
      padding: 0.2rem 0.6rem;
      box-shadow: 0 3px 8px rgba(43, 36, 64, 0.1);
      font-weight: bold;
    }
    .legend i { width: 0.8rem; height: 0.8rem; border-radius: 4px; display: inline-block; }

    /* ---------- info card (Atlas + answers) ---------- */
    .info {
      background: var(--paper);
      border-radius: 20px;
      padding: 0.85rem 1rem;
      margin-top: 0.6rem;
      box-shadow: 0 8px 22px rgba(43, 36, 64, 0.12);
      text-align: center;
      border: 4px solid var(--purple);
    }
    .info h3 { margin: 0 0 0.15rem; font-size: 1.25rem; color: var(--purple); }
    .info .sub { margin: 0 0 0.35rem; font-weight: bold; color: var(--pink); }
    .info p { margin: 0; color: var(--ink); font-size: 1rem; }

    .stars { font-size: 1.3rem; min-height: 1.3rem; margin: 0.35rem 0 0; text-align: center; }
    .hidden { display: none !important; }

    @media (max-width: 430px) {
      .mode-btn { font-size: 0.9rem; padding: 0.4rem 0.6rem; }
      #states { gap: 0.2rem; }
    }
  </style>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <a class="back-link" href="../../">← Back to the Arcade</a>

  <header class="hero" style="padding-top: 0.25rem; padding-bottom: 0.5rem;">
    <h1 class="title" style="font-size: clamp(1.8rem, 5vw, 3rem);"><span class="emo">🌍</span> World Trek</h1>
  </header>

  <nav class="modes" id="modes" aria-label="Pick a way to explore">
    <button class="mode-btn" data-mode="continents" aria-pressed="true">🌍 Continents</button>
    <button class="mode-btn" data-mode="oceans" aria-pressed="false">🌊 Oceans</button>
    <button class="mode-btn" data-mode="states" aria-pressed="false">🗺️ Find&nbsp;a&nbsp;State</button>
    <button class="mode-btn" data-mode="capitals" aria-pressed="false">🏛️ Capitals</button>
    <button class="mode-btn" data-mode="atlas" aria-pressed="false">📖 Atlas</button>
  </nav>

  <main class="stage">
    <div class="prompt-card" aria-live="polite">
      <h2 id="prompt-title">Where in the world?</h2>
      <p id="prompt-text">Loading the map…</p>
      <div class="row" id="prompt-actions"></div>
    </div>

    <div class="scorebar" id="scorebar"></div>
    <p class="stars" id="stars"></p>

    <div class="map-card" id="world-card">
      <div id="world" role="img" aria-label="A pixel map of the world">
        <div class="map-labels" id="world-labels" aria-hidden="true"></div>
      </div>
      <div class="legend" id="world-legend"></div>
    </div>

    <div class="map-card hidden" id="states-card">
      <div id="states" aria-label="A puzzle map of the 50 states"></div>
      <div class="legend" id="states-legend"></div>
    </div>

    <div class="info hidden" id="info">
      <h3 id="info-name"></h3>
      <p class="sub" id="info-sub"></p>
      <p id="info-fact"></p>
    </div>
  </main>

  <script src="../../assets/js/sfx.js"></script>
  <script src="../../assets/js/confetti.js"></script>
  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
