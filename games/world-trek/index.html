<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌍 World Trek</title>
  <meta name="description" content="Tap the continents and oceans on a pixel world map, find all 50 states, learn capitals and flags, play Which Is Bigger, and fill a passport of stickers." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>" />
  <meta name="theme-color" content="#8a5cff" />
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <style>
    /* ---------- mode picker ---------- */
    .modes {
      max-width: 780px;
      margin: 0 auto 0.5rem;
      padding: 0 0.75rem;
    }
    .mode-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.35rem;
    }
    .mode-row > .row-tag {
      font-size: 0.82rem;
      font-weight: bold;
      color: #6a6385;
      letter-spacing: 0.03em;
      min-width: 3.6rem;
      text-align: right;
    }
    .mode-btn {
      font-family: var(--font);
      font-size: 0.98rem;
      font-weight: bold;
      color: var(--purple);
      background: var(--paper);
      border: 3px solid var(--blue);
      border-radius: 16px;
      padding: 0.45rem 0.75rem;
      min-height: 44px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.12s ease;
    }
    .mode-btn:hover { transform: translateY(-2px); }
    .mode-btn[aria-pressed="true"] {
      color: #fff;
      background: linear-gradient(90deg, var(--blue), var(--purple));
      border-color: var(--purple);
    }
    .mode-btn:focus-visible,
    .btn:focus-visible,
    .scell:focus-visible,
    .wcell:focus-visible,
    .choice:focus-visible,
    .diff-btn:focus-visible {
      outline: 4px solid #1b1330;
      outline-offset: 2px;
    }

    /* ---------- difficulty ---------- */
    .diffs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.35rem;
      margin: 0 auto 0.55rem;
      padding: 0 0.75rem;
      font-size: 0.85rem;
      font-weight: bold;
      color: #6a6385;
    }
    .diff-btn {
      font-family: var(--font);
      font-size: 0.88rem;
      font-weight: bold;
      color: #4d4470;
      background: var(--paper);
      border: 2px solid #cfc8ea;
      border-radius: 999px;
      padding: 0.35rem 0.7rem;
      min-height: 36px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .diff-btn[aria-pressed="true"] {
      color: #fff;
      background: var(--purple);
      border-color: var(--purple);
    }

    .stage { max-width: 780px; margin: 0 auto 2.5rem; padding: 0 0.75rem; }

    .prompt-card {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 22px;
      padding: 0.8rem 1rem;
      box-shadow: 0 8px 22px rgba(43, 36, 64, 0.12);
      text-align: center;
    }
    .prompt-card h2 { margin: 0 0 0.3rem; font-size: 1.35rem; color: var(--purple); }
    .prompt-card p  { margin: 0; color: var(--ink); font-size: 1.02rem; min-height: 1.3em; }
    .prompt-card .row { margin-top: 0.6rem; }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      align-items: center;
    }

    .btn {
      font-family: var(--font);
      font-size: 1.02rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(90deg, var(--pink), var(--purple));
      border: none;
      border-radius: 999px;
      padding: 0.55rem 1.2rem;
      min-height: 44px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(138, 92, 255, 0.28);
      transition: transform 0.15s ease;
      touch-action: manipulation;
    }
    .btn:hover { transform: scale(1.04); }
    .btn.ghost {
      color: var(--purple);
      background: var(--paper);
      border: 3px solid var(--purple);
      box-shadow: 0 6px 14px rgba(43, 36, 64, 0.12);
    }

    .scorebar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      font-weight: bold;
      color: #5b4f86;
      margin: 0.6rem 0 0.4rem;
      font-size: 1.02rem;
    }
    .scorebar span { color: #d81b60; }

    /* ---------- the pixel world map ---------- */
    .map-card {
      background: rgba(255, 255, 255, 0.6);
      border-radius: 22px;
      padding: 0.5rem;
      box-shadow: 0 8px 22px rgba(43, 36, 64, 0.1);
      margin-top: 0.5rem;
    }
    #world {
      position: relative;
      display: grid;
      grid-template-columns: repeat(48, 1fr);
      grid-template-rows: repeat(22, 1fr);
      aspect-ratio: 48 / 22;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      touch-action: manipulation;
    }
    .wcell { display: block; }
    .wcell.lit { box-shadow: inset 0 0 0 100px rgba(255, 255, 255, 0.55); }
    .wcell.wrong { box-shadow: inset 0 0 0 100px rgba(226, 59, 59, 0.45); }

    /* Grown-up tier: the map keeps its shape but loses its colour key. */
    #world.plain .wcell[data-kind="continent"] { background: #9ec99b !important; }
    #world.plain .wcell[data-kind="ocean"] { background: #86c3e6 !important; }

    .map-labels {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .map-labels b,
    .map-labels em {
      position: absolute;
      transform: translate(-50%, -50%);
      font-size: clamp(0.5rem, 1.5vw, 0.85rem);
      color: #2b2440;
      text-shadow: 0 1px 0 #fff, 0 0 5px #fff;
      white-space: nowrap;
    }
    .map-labels em {
      font-size: clamp(0.42rem, 1.25vw, 0.72rem);
      font-style: italic;
      color: #123a55;
    }

    /* ---------- the states puzzle map ---------- */
    /* Eleven columns on a 390px phone can only ever be ~32px squares,
       so there's a zoom that scrolls sideways and gives small fingers
       proper 48px targets. It remembers which you chose. */
    .states-scroll { overflow-x: auto; overscroll-behavior-x: contain; }
    .states-scroll.zoom #states { min-width: 560px; }
    .zoom-row {
      display: flex;
      justify-content: center;
      margin-bottom: 0.35rem;
    }
    .zoom-btn {
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--purple);
      background: var(--paper);
      border: 2px solid var(--purple);
      border-radius: 999px;
      padding: 0.3rem 0.75rem;
      min-height: 36px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .zoom-btn[aria-pressed="true"] { color: #fff; background: var(--purple); }
    #states {
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      gap: 0.3rem;
      width: 100%;
    }
    .scell {
      font-family: var(--font);
      font-weight: 900;
      font-size: clamp(0.6rem, 2.1vw, 1.05rem);
      color: #2b2440;
      border: none;
      border-radius: 8px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s ease;
      padding: 0;
    }
    .scell:hover { transform: scale(1.08); }
    .scell:active { transform: scale(0.94); }
    .scell.blank { background: transparent; cursor: default; }
    .scell.blank:hover { transform: none; }
    /* Harder tiers hide the two-letter code (and then the region colour),
       so you have to actually know where the state is. */
    #states.hide-codes .scell { color: transparent; }
    #states.plain .scell:not(.good):not(.bad):not(.lit):not(.blank) { background: #d9e4f2 !important; }
    .scell.lit  { box-shadow: 0 0 0 3px #2b2440 inset; transform: scale(1.12); }
    .scell.good { background: var(--green) !important; color: #fff; }
    .scell.bad  { background: #ff7a7a !important; color: #fff; }

    /* ---------- legend ---------- */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: center;
      margin: 0.55rem 0 0;
      font-size: 0.85rem;
      font-weight: bold;
      color: #574f75;
    }
    .legend b {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: var(--paper);
      border-radius: 999px;
      padding: 0.2rem 0.6rem;
      box-shadow: 0 3px 8px rgba(43, 36, 64, 0.1);
      font-weight: bold;
    }
    .legend i { width: 0.8rem; height: 0.8rem; border-radius: 4px; display: inline-block; }

    /* ---------- flags & multiple-choice ---------- */
    .flag-stage {
      display: flex;
      justify-content: center;
      margin: 0.6rem 0 0.2rem;
    }
    .flag {
      width: min(46vw, 210px);
      height: auto;
      aspect-ratio: 3 / 2;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(43, 36, 64, 0.25);
      background: #fff;
      display: block;
    }
    .flag.mini {
      width: 100%;
      max-width: 130px;
      box-shadow: 0 3px 9px rgba(43, 36, 64, 0.22);
    }
    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.55rem;
      margin: 0.7rem auto 0;
      max-width: 620px;
    }
    .choices.wide { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .choice {
      font-family: var(--font);
      font-size: 1rem;
      font-weight: bold;
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--blue);
      border-radius: 18px;
      padding: 0.6rem 0.5rem;
      min-height: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.12s ease;
    }
    .choice:hover { transform: translateY(-2px); }
    .choice.good { background: var(--green); border-color: #26a866; color: #fff; }
    .choice.bad  { background: #ff9d9d; border-color: #e05555; color: #4a1010; }
    .choice small { font-weight: bold; font-size: 0.82rem; color: #5b4f86; }
    .choice.good small, .choice.bad small { color: inherit; }

    /* ---------- info card (Atlas + answers) ---------- */
    .info {
      background: var(--paper);
      border-radius: 20px;
      padding: 0.85rem 1rem;
      margin-top: 0.6rem;
      box-shadow: 0 8px 22px rgba(43, 36, 64, 0.12);
      text-align: center;
      border: 4px solid var(--purple);
    }
    .info h3 { margin: 0 0 0.15rem; font-size: 1.25rem; color: var(--purple); }
    .info .sub { margin: 0 0 0.35rem; font-weight: bold; color: #d81b60; }
    .info p { margin: 0; color: var(--ink); font-size: 1rem; }
    .info .more {
      margin-top: 0.45rem;
      font-size: 0.92rem;
      color: #4d4470;
      line-height: 1.5;
      white-space: pre-line;
    }
    .info .why {
      margin-top: 0.45rem;
      font-size: 0.95rem;
      background: #fff6db;
      border-radius: 12px;
      padding: 0.4rem 0.6rem;
      color: #6b4c00;
    }
    .info-flag { display: flex; justify-content: center; margin-bottom: 0.4rem; }

    /* ---------- passport ---------- */
    .passport { margin-top: 0.6rem; }
    .pp-section { margin-bottom: 0.9rem; }
    .pp-section h3 {
      margin: 0 0 0.4rem;
      font-size: 1.05rem;
      color: var(--purple);
      text-align: center;
    }
    .pp-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      justify-content: center;
    }
    .sticker {
      font-family: var(--font);
      font-size: 0.82rem;
      font-weight: bold;
      border-radius: 12px;
      padding: 0.35rem 0.5rem;
      min-width: 3rem;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      background: #e6e2f0;
      color: #9a93b0;
      border: 2px dashed #c6bedd;
    }
    .sticker.got {
      background: linear-gradient(140deg, #fff, #ffeef8);
      color: #2b2440;
      border: 2px solid var(--pink);
      box-shadow: 0 4px 10px rgba(255, 93, 143, 0.25);
    }
    .badges { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; }
    .badge {
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 999px;
      padding: 0.35rem 0.7rem;
      background: #ece8f7;
      color: #9a93b0;
      border: 2px dashed #c6bedd;
    }
    .badge.got {
      background: linear-gradient(90deg, var(--yellow), #ffb703);
      color: #4a3200;
      border: 2px solid #e09b00;
    }

    .stars { font-size: 1.3rem; min-height: 1.3rem; margin: 0.35rem 0 0; text-align: center; }
    .hidden { display: none !important; }

    .lbl-short { display: none; }

    @media (max-width: 470px) {
      /* Keep the whole menu to three tight rows so the map stays in view. */
      .lbl-long { display: none; }
      .lbl-short { display: inline; }
      .modes { padding: 0 0.4rem; margin-bottom: 0.35rem; }
      .mode-row { gap: 0.3rem; margin-bottom: 0.3rem; }
      .mode-row > .row-tag { display: none; }
      .mode-btn { font-size: 0.85rem; padding: 0.35rem 0.5rem; border-width: 2px; }
      .diffs { gap: 0.3rem; margin-bottom: 0.45rem; }
      .diff-btn { font-size: 0.82rem; padding: 0.3rem 0.55rem; }
      .stage { padding: 0 0.5rem; }
      /* Let the maps use the whole screen width so the state squares
         stay big enough for small fingers. */
      .map-card { margin-left: -0.4rem; margin-right: -0.4rem; padding: 0.3rem; }
      #states { gap: 0.16rem; }
      .scell { border-radius: 6px; }
      .choices { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
      .mode-btn:hover, .btn:hover, .scell:hover, .choice:hover, .scell:active { transform: none; }
    }
  </style>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <a class="back-link" href="../../">← Back to the Arcade</a>

  <header class="hero" style="padding-top: 0.25rem; padding-bottom: 0.5rem;">
    <h1 class="title" style="font-size: clamp(1.8rem, 5vw, 3rem);"><span class="emo">🌍</span> World Trek</h1>
  </header>

  <nav class="modes" id="modes" aria-label="Pick a way to explore">
    <div class="mode-row">
      <span class="row-tag">World</span>
      <button class="mode-btn" data-mode="continents" aria-pressed="true">🌍 Continents</button>
      <button class="mode-btn" data-mode="oceans" aria-pressed="false">🌊 Oceans</button>
      <button class="mode-btn" data-mode="flags" aria-pressed="false">🚩 Flags</button>
    </div>
    <div class="mode-row">
      <span class="row-tag">USA</span>
      <button class="mode-btn" data-mode="states" aria-pressed="false">🗺️ <span class="lbl-long">Find&nbsp;a&nbsp;State</span><span class="lbl-short">States</span></button>
      <button class="mode-btn" data-mode="capitals" aria-pressed="false">🏛️ Capitals</button>
    </div>
    <div class="mode-row">
      <span class="row-tag">More</span>
      <button class="mode-btn" data-mode="bigger" aria-pressed="false">⚖️ <span class="lbl-long">Which&nbsp;Is&nbsp;Bigger?</span><span class="lbl-short">Bigger?</span></button>
      <button class="mode-btn" data-mode="atlas" aria-pressed="false">📖 Atlas</button>
      <button class="mode-btn" data-mode="passport" aria-pressed="false">🛂 Passport</button>
    </div>
  </nav>

  <div class="diffs" id="diffs" role="group" aria-label="How hard should it be?">
    <span class="lbl-long">How hard?</span>
    <button class="diff-btn" data-diff="easy" aria-pressed="true">🐣 Easy</button>
    <button class="diff-btn" data-diff="normal" aria-pressed="false">🧭 Explorer</button>
    <button class="diff-btn" data-diff="expert" aria-pressed="false">🎓 Grown-up</button>
  </div>

  <main class="stage">
    <div class="prompt-card" aria-live="polite">
      <h2 id="prompt-title">Where in the world?</h2>
      <p id="prompt-text">Loading the map…</p>
      <div class="flag-stage hidden" id="flag-stage"></div>
      <div class="choices hidden" id="choices"></div>
      <div class="row" id="prompt-actions"></div>
    </div>

    <div class="scorebar" id="scorebar"></div>
    <p class="stars" id="stars"></p>

    <div class="map-card" id="world-card">
      <div id="world" role="group" aria-label="A pixel map of the world — tab to each continent and ocean">
        <div class="map-labels" id="world-labels" aria-hidden="true"></div>
      </div>
      <div class="legend" id="world-legend"></div>
    </div>

    <div class="map-card hidden" id="states-card">
      <div class="zoom-row">
        <button class="zoom-btn" id="zoom-btn" type="button" aria-pressed="false">🔍 Bigger squares</button>
      </div>
      <div class="states-scroll" id="states-scroll">
        <div id="states" role="group" aria-label="A puzzle map of the 50 states — use the arrow keys to move around it"></div>
      </div>
      <div class="legend" id="states-legend"></div>
    </div>

    <div class="info hidden" id="info">
      <div class="info-flag hidden" id="info-flag"></div>
      <h3 id="info-name"></h3>
      <p class="sub" id="info-sub"></p>
      <p id="info-fact"></p>
      <p class="more hidden" id="info-more"></p>
      <p class="why hidden" id="info-why"></p>
    </div>

    <div class="passport hidden" id="passport" aria-live="polite"></div>
  </main>

  <script src="../../assets/js/sfx.js"></script>
  <script src="../../assets/js/confetti.js"></script>
  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
