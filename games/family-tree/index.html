<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌳 Family Tree</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌳</text></svg>" />
  <meta name="theme-color" content="#3ddc84" />
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <style>
    /* ---------- page layout ---------- */
    .ft-wrap { max-width: 1100px; margin: 0 auto; padding: 0 0.8rem 2rem; }

    .ft-toolbar {
      display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center;
      justify-content: center; margin: 0.4rem auto 0.8rem;
    }
    .ft-toolbar .me-pick {
      display: flex; align-items: center; gap: 0.4rem;
      background: var(--paper); border: 3px solid var(--yellow);
      border-radius: 999px; padding: 0.35rem 0.8rem; font-weight: 700;
      box-shadow: 0 3px 0 rgba(43,36,64,0.12);
    }
    .ft-toolbar select {
      font: inherit; font-weight: 700; color: var(--ink);
      border: none; background: transparent; padding: 0.2rem; max-width: 11rem;
    }
    .ft-btn {
      font: inherit; font-weight: 800; color: var(--ink); cursor: pointer;
      background: var(--paper); border: 3px solid var(--blue);
      border-radius: 999px; padding: 0.45rem 0.9rem;
      box-shadow: 0 3px 0 rgba(43,36,64,0.12);
      min-height: 44px;
    }
    .ft-btn:active { transform: translateY(2px); box-shadow: none; }
    .ft-btn.danger { border-color: var(--pink); }
    .zoom-group { display: flex; gap: 0.35rem; }
    .zoom-group .ft-btn { min-width: 44px; }

    /* ---------- tree viewport ---------- */
    #viewport {
      position: relative;
      height: min(62vh, 640px);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      background: rgba(255,255,255,0.65);
      border: 3px solid rgba(138,92,255,0.25);
      border-radius: 24px;
      box-shadow: inset 0 2px 10px rgba(43,36,64,0.06);
    }
    #sizer { position: relative; margin: 0 auto; }
    #canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
    #edges { position: absolute; top: 0; left: 0; pointer-events: none; }

    /* ---------- person cards ---------- */
    .person {
      position: absolute;
      width: 112px; height: 128px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; padding: 6px 4px;
      background: var(--paper);
      border: 3px solid var(--purple);
      border-radius: 18px;
      box-shadow: 0 4px 0 rgba(43,36,64,0.12);
      cursor: pointer; font: inherit; color: var(--ink);
      transition: transform 0.12s ease;
    }
    .person:hover { transform: scale(1.05); z-index: 5; }
    .person:active { transform: scale(0.97); }
    .person .face { font-size: 2.3rem; line-height: 1.1; }
    .person .pname {
      font-weight: 800; font-size: 0.85rem; line-height: 1.1;
      max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .person .rel {
      font-size: 0.66rem; font-weight: 800; color: #fff;
      background: var(--purple); border-radius: 999px;
      padding: 2px 8px; max-width: 102px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .person .rel:empty { display: none; }
    .person.is-me { outline: 4px solid var(--yellow); outline-offset: 2px; }
    .person .you-star {
      position: absolute; top: -12px; right: -10px; font-size: 1.3rem;
      filter: drop-shadow(0 2px 2px rgba(43,36,64,0.3));
    }

    .ft-hint { text-align: center; color: #6b6383; font-weight: 600; margin: 0.8rem auto 0; max-width: 40rem; }

    /* ---------- modals ---------- */
    .overlay {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      background: rgba(43,36,64,0.45); padding: 1rem;
    }
    .overlay[hidden] { display: none; }
    .sheet {
      background: var(--paper); border-radius: 24px;
      padding: 1.2rem 1.2rem 1rem; width: 100%; max-width: 24rem;
      max-height: 88vh; overflow: auto;
      box-shadow: 0 12px 40px rgba(43,36,64,0.35);
    }
    .sheet h2 { margin: 0 0 0.8rem; font-size: 1.25rem; text-align: center; }
    .sheet .sub { text-align: center; margin: -0.5rem 0 0.8rem; color: #6b6383; font-weight: 600; }
    .action-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .action-list .ft-btn { width: 100%; text-align: left; border-radius: 16px; font-size: 1rem; }

    .field { margin-bottom: 0.9rem; }
    .field label { display: block; font-weight: 800; margin-bottom: 0.35rem; }
    .field input[type="text"] {
      width: 100%; font: inherit; font-weight: 700; color: var(--ink);
      border: 3px solid var(--blue); border-radius: 14px; padding: 0.55rem 0.7rem;
    }
    .chip-row { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .chip {
      font: inherit; font-weight: 700; color: var(--ink); cursor: pointer;
      background: #f4f1ff; border: 3px solid transparent; border-radius: 999px;
      padding: 0.35rem 0.75rem; min-height: 42px;
    }
    .chip.sel { border-color: var(--purple); background: #fff; }
    .emoji-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.25rem; }
    .emoji-grid .chip { padding: 0.15rem; font-size: 1.35rem; min-height: 44px; border-radius: 12px; }
    .sheet-btns { display: flex; gap: 0.5rem; margin-top: 0.4rem; }
    .sheet-btns .ft-btn { flex: 1; text-align: center; border-radius: 16px; }
    .ft-btn.primary { background: var(--green); border-color: #23b368; color: #063; }

    @media (max-width: 480px) {
      .person { width: 96px; height: 118px; }
      .person .face { font-size: 2rem; }
      .emoji-grid { grid-template-columns: repeat(6, 1fr); }
    }
  </style>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <a class="back-link" href="../../">← Back to the Arcade</a>

  <header class="hero" style="padding-top: 0.5rem; padding-bottom: 0;">
    <h1 class="title">🌳 Family Tree</h1>
  </header>

  <main class="ft-wrap">
    <div class="ft-toolbar">
      <span class="me-pick">⭐
        <select id="me-select" aria-label="Who are you?"></select>
      </span>
      <span class="zoom-group">
        <button class="ft-btn" id="zoom-out" aria-label="Zoom out">➖</button>
        <button class="ft-btn" id="zoom-in" aria-label="Zoom in">➕</button>
      </span>
      <button class="ft-btn danger" id="reset-btn">🔄 Start over</button>
    </div>

    <div id="viewport">
      <div id="sizer">
        <div id="canvas">
          <svg id="edges" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
      </div>
    </div>

    <p class="ft-hint">Tap anyone to add their mom, dad, partner, kids, brothers &amp; sisters —
    keep growing the tree forever! Pick who <strong>you</strong> are up top to learn the special
    word for how each person is related to you. One tree for the whole family, saved on this device. 💾</p>
  </main>

  <!-- action sheet: tap a person -->
  <div class="overlay" id="action-overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <h2 id="action-title"></h2>
      <p class="sub" id="action-sub"></p>
      <div class="action-list" id="action-list"></div>
    </div>
  </div>

  <!-- add / edit form -->
  <div class="overlay" id="form-overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <h2 id="form-title"></h2>
      <div class="field">
        <label for="name-input">Name</label>
        <input type="text" id="name-input" maxlength="24" autocomplete="off" placeholder="Type a name…" />
      </div>
      <div class="field">
        <label>Boy or girl?</label>
        <div class="chip-row" id="gender-row">
          <button class="chip" data-g="m">👦 Boy</button>
          <button class="chip" data-g="f">👧 Girl</button>
          <button class="chip" data-g="">✨ Skip</button>
        </div>
      </div>
      <div class="field" id="other-parent-field" hidden>
        <label>Who is the other parent?</label>
        <div class="chip-row" id="other-parent-row"></div>
      </div>
      <div class="field">
        <label>Pick a face</label>
        <div class="emoji-grid" id="emoji-grid"></div>
      </div>
      <div class="sheet-btns">
        <button class="ft-btn" id="form-cancel">Cancel</button>
        <button class="ft-btn primary" id="form-save">Save ✔</button>
      </div>
    </div>
  </div>

  <!-- confirm -->
  <div class="overlay" id="confirm-overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <h2 id="confirm-title"></h2>
      <p class="sub" id="confirm-sub"></p>
      <div class="sheet-btns">
        <button class="ft-btn" id="confirm-no">Cancel</button>
        <button class="ft-btn danger" id="confirm-yes">Yes</button>
      </div>
    </div>
  </div>

  <script src="../../assets/js/sfx.js"></script>
  <script src="../../assets/js/confetti.js"></script>
  <script src="game.js"></script>
</body>
</html>
