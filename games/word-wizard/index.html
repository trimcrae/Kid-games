<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📚 Word Wizard</title>
  <meta name="description" content="Spell words from their clues, learn what they mean and why they're tricky — a spelling &amp; vocabulary game for big readers (and grown-ups)." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>" />
  <meta name="theme-color" content="#8a5cff" />
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <style>
    [hidden] { display: none !important; }

    /* ---- shared button look (matches the other games) ---- */
    .btn {
      font-family: var(--font);
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(90deg, var(--pink), var(--purple));
      border: none;
      border-radius: 999px;
      padding: 0.8rem 2rem;
      min-height: 3rem;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(138, 92, 255, 0.3);
      transition: transform 0.15s ease;
      touch-action: manipulation;
    }
    .btn:hover { transform: scale(1.05); }
    .btn:disabled { opacity: 0.45; cursor: default; transform: none; box-shadow: none; }
    .btn.ghost {
      background: var(--paper);
      color: var(--purple);
      box-shadow: 0 6px 16px rgba(43, 36, 64, 0.12);
    }
    .btn.small { font-size: 1rem; padding: 0.6rem 1.15rem; min-height: 2.9rem; }
    .btn:focus-visible, .letter:focus-visible, .level-card:focus-visible, .dict-hear:focus-visible {
      outline: 4px solid var(--yellow);
      outline-offset: 3px;
    }

    .ww-bar {
      display: flex;
      justify-content: center;
      gap: 0.5rem 1.1rem;
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--purple);
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }
    .ww-bar > div {
      background: rgba(255, 255, 255, 0.72);
      border-radius: 999px;
      padding: 0.28rem 0.8rem;
      white-space: nowrap;
    }
    .ww-bar span { color: var(--pink); }

    /* ---- level select ---- */
    .level-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.25rem;
      max-width: 760px;
      margin: 0 auto;
    }
    .level-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      background: var(--paper);
      border: 4px solid transparent;
      border-radius: 22px;
      padding: 1.4rem 1rem;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(43, 36, 64, 0.12);
      transition: transform 0.15s ease, border-color 0.15s ease;
      font-family: var(--font);
      color: var(--ink);
      text-align: center;
    }
    .level-card:hover:not(.locked),
    .level-card:focus-visible:not(.locked) {
      transform: translateY(-6px);
      border-color: var(--accent, var(--purple));
    }
    .level-card .lv-emoji { width: 3.4rem; height: 3.4rem; line-height: 1; display: block; }
    .level-card .lv-emoji svg { width: 100%; height: 100%; display: block; }
    .level-card .lv-lock { font-size: 2.8rem; }
    .level-card h3 { margin: 0; font-size: 1.15rem; }
    .level-card .lv-progress { font-size: 0.85rem; color: #5a5375; font-weight: bold; }
    .level-card.locked { opacity: 0.6; cursor: default; }
    .level-card.done { border-color: var(--green); }
    /* phones: two compact columns instead of one giant card per row */
    @media (max-width: 520px) {
      .level-grid { grid-template-columns: 1fr 1fr; gap: 0.7rem; }
      .level-card { padding: 0.9rem 0.5rem; border-radius: 18px; gap: 0.25rem; }
      .level-card .lv-emoji { width: 2.6rem; height: 2.6rem; }
      .level-card .lv-lock { font-size: 2.1rem; }
      .level-card h3 { font-size: 0.98rem; }
      .level-card .lv-progress { font-size: 0.78rem; }
    }

    /* ---- play screen ---- */
    #play.hidden, #levels.hidden, #win.hidden, #dict.hidden { display: none; }

    .word-progress {
      font-size: 0.95rem;
      font-weight: bold;
      color: #5a5375;
      margin: 0 0 0.5rem;
    }

    .clue-card {
      max-width: 520px;
      margin: 0 auto 1.25rem;
      background: var(--paper);
      border-radius: 24px;
      padding: 1.5rem 1.25rem;
      box-shadow: 0 12px 30px rgba(43, 36, 64, 0.14);
    }
    .clue-emoji { width: 6rem; height: 6rem; margin: 0 auto; line-height: 1; }
    .clue-emoji svg { width: 100%; height: 100%; display: block; }
    .clue-text { font-size: 1.25rem; margin: 0.5rem 0 0; color: var(--ink); }

    /* letter slots */
    .slots {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0 auto 1.25rem;
      max-width: 600px;
    }
    .slot {
      width: 2.6rem;
      height: 3.2rem;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: inset 0 0 0 3px rgba(138, 92, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.9rem;
      font-weight: bold;
      color: var(--purple);
      text-transform: uppercase;
    }
    /* long words (10+ letters) get slimmer slots so they stay on one or two rows */
    .slots.tight { gap: 0.3rem; }
    .slots.tight .slot { width: 2rem; height: 2.7rem; font-size: 1.5rem; border-radius: 10px; }
    .slot.filled { background: var(--purple); color: #fff; box-shadow: 0 4px 10px rgba(138,92,255,0.35); }
    .slot.good   { background: var(--green); box-shadow: 0 4px 10px rgba(61,220,132,0.4); }
    .slots.wrong { animation: shake 0.4s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-9px); }
      60% { transform: translateX(9px); }
    }

    /* letter bank */
    .bank {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.6rem;
      max-width: 560px;
      margin: 0 auto 1.25rem;
    }
    .letter {
      width: 3.2rem;
      height: 3.2rem;
      border-radius: 16px;
      border: none;
      background: linear-gradient(160deg, #fff, #f0e9ff);
      color: var(--ink);
      font-family: var(--font);
      font-size: 1.7rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(43, 36, 64, 0.16);
      transition: transform 0.1s ease, opacity 0.15s ease;
      touch-action: manipulation;
    }
    .letter:hover:not(:disabled) { transform: translateY(-3px); }
    .letter:active { transform: scale(0.9); }
    .letter:disabled { opacity: 0.25; cursor: default; }
    .letter.glow {
      animation: letter-glow 0.8s ease 2;
      box-shadow: 0 0 0 4px var(--yellow), 0 6px 18px rgba(255, 209, 102, 0.8);
    }
    @keyframes letter-glow {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.15); }
    }

    .controls { display: flex; justify-content: center; gap: 0.6rem; flex-wrap: wrap; }

    .feedback {
      min-height: 3.2rem;
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--green);
      margin: 0 auto 0.6rem;
      max-width: 540px;
    }

    /* ---- word study card (shown after a correct spelling) ---- */
    .study {
      max-width: 520px;
      margin: 0 auto;
      background: var(--paper);
      border-radius: 24px;
      padding: 1.1rem 1.15rem 1.3rem;
      box-shadow: 0 12px 30px rgba(43, 36, 64, 0.16);
      border-top: 8px solid var(--green);
      text-align: center;
    }
    .study-art { width: 4.6rem; height: 4.6rem; margin: 0 auto 0.2rem; }
    .study-art svg { width: 100%; height: 100%; display: block; }
    .study-word {
      font-size: 2rem; font-weight: bold; color: var(--purple);
      text-transform: capitalize; margin: 0; line-height: 1.1;
      overflow-wrap: anywhere;
    }
    .study-pos {
      display: inline-block; margin: 0.25rem 0 0.5rem; font-size: 0.85rem;
      font-weight: bold; letter-spacing: 0.05em; text-transform: uppercase;
      color: #4d4668; background: #f0e9ff; border-radius: 999px; padding: 0.15rem 0.7rem;
    }
    .study-def { font-size: 1.1rem; margin: 0 0 0.55rem; color: var(--ink); }
    .study-sentence {
      font-size: 1.05rem; font-style: italic; color: #4d4668;
      margin: 0 0 0.55rem;
    }
    .study-tip {
      font-size: 1rem; font-weight: bold; color: #6b4bb8; margin: 0 0 0.9rem;
      background: #f7f2ff; border-radius: 14px; padding: 0.55rem 0.7rem; text-align: left;
    }

    /* "My Words" dictionary */
    .dict-list { display: flex; flex-direction: column; gap: 0.6rem; max-width: 560px; margin: 0 auto 1rem; }
    .dict-card {
      display: flex; align-items: center; gap: 0.8rem; text-align: left;
      background: var(--paper); border-left: 8px solid var(--accent, var(--purple));
      border-radius: 16px; padding: 0.6rem 0.8rem;
      box-shadow: 0 8px 20px rgba(43, 36, 64, 0.1);
    }
    .dict-art { flex: 0 0 auto; width: 3rem; height: 3rem; }
    .dict-art svg { width: 100%; height: 100%; display: block; }
    .dict-body { flex: 1 1 auto; display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
    .dict-word { font-size: 1.15rem; color: var(--purple); text-transform: capitalize; }
    .dict-clue { font-size: 0.92rem; color: #4d4668; }
    .dict-tip { font-size: 0.85rem; color: #6b4bb8; font-weight: bold; }
    .dict-hear {
      flex: 0 0 auto; width: 2.9rem; height: 2.9rem; border: none; border-radius: 50%;
      background: #f0e9ff; font-size: 1.2rem; cursor: pointer; touch-action: manipulation;
    }
    .dict-hear:active { transform: scale(0.9); }
    .dict-summary { font-weight: bold; color: #5a5375; margin: 0 0 0.8rem; }

    /* win screen */
    #win { text-align: center; }
    #win .big { width: 7rem; height: 7rem; margin: 0 auto; }
    #win .big svg { width: 100%; height: 100%; display: block; }
    #win h2 { color: var(--purple); font-size: 2rem; margin: 0.5rem 0; }
    .win-stats {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem;
      max-width: 560px; margin: 0.9rem auto 1.1rem;
    }
    .win-stats .stat {
      background: var(--paper); border-radius: 999px; padding: 0.35rem 0.9rem;
      font-weight: bold; color: #4d4668; box-shadow: 0 6px 14px rgba(43, 36, 64, 0.1);
    }

    /* sparkles on a correct answer */
    .sparkle {
      position: fixed;
      font-size: 1.5rem;
      pointer-events: none;
      animation: sparkle-up 0.9s ease-out forwards;
      z-index: 5;
    }
    @keyframes sparkle-up {
      0%   { opacity: 1; transform: translateY(0) scale(0.6) rotate(0deg); }
      100% { opacity: 0; transform: translateY(-90px) scale(1.4) rotate(40deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .slots.wrong, .sparkle, .letter.glow { animation: none; }
      .sparkle { display: none; }
      .btn:hover, .level-card:hover, .letter:hover:not(:disabled) { transform: none; }
    }

    @media (max-width: 420px) {
      .ww-bar { font-size: 0.92rem; gap: 0.35rem 0.5rem; }
      .btn { font-size: 1.05rem; padding: 0.7rem 1.2rem; }
      .letter { width: 2.9rem; height: 2.9rem; font-size: 1.5rem; }
      .clue-text { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <a class="back-link" href="../../">← Back to the Arcade</a>

  <header class="hero" style="padding-top: 0.5rem;">
    <h1 class="title"><span class="emo">📚</span> Word Wizard</h1>
    <p class="subtitle">Read the clue, spell the magic word, learn what it means! ✨</p>
  </header>

  <div class="ww-bar">
    <div>⭐ Stars: <span id="stars">0</span></div>
    <div>📖 Words: <span id="learned">0</span></div>
    <div title="Words spelled right first try, in a row">🔥 Streak: <span id="fire">0</span></div>
    <div>🎖 <span id="rank">Apprentice</span></div>
  </div>

  <main class="game-stage" style="max-width: 760px;">

    <!-- LEVEL SELECT -->
    <section id="levels">
      <p style="font-weight:bold;color:var(--purple);font-size:1.2rem;margin-top:0;">Pick a spellbook:</p>
      <div class="level-grid" id="level-grid"></div>
      <div class="controls" style="margin-top:1.1rem;">
        <button class="btn ghost" id="dict-btn">📖 My Words</button>
      </div>
    </section>

    <!-- MY WORDS (dictionary of mastered words) -->
    <section id="dict" class="hidden">
      <p style="font-weight:bold;color:var(--purple);font-size:1.2rem;margin-top:0;">Every word you've learned — tap 🔊 to hear it!</p>
      <p class="dict-summary" id="dict-summary"></p>
      <div class="dict-list" id="dict-list"></div>
      <div class="controls">
        <button class="btn" id="dict-practise">🔁 Practise these</button>
        <button class="btn ghost" id="dict-back">📚 Back to spellbooks</button>
      </div>
    </section>

    <!-- PLAY -->
    <section id="play" class="hidden">
      <p class="word-progress" id="word-progress"></p>
      <p class="feedback" id="feedback" aria-live="polite"></p>

      <div class="clue-card" id="clue-card">
        <div class="clue-emoji" id="clue-emoji" aria-hidden="true"></div>
        <p class="clue-text" id="clue-text">…</p>
      </div>

      <div class="slots" id="slots" role="img" aria-label="Spell the word here"></div>
      <div class="bank" id="bank"></div>

      <div class="controls" id="controls">
        <button class="btn ghost small" id="hear-btn" aria-label="Hear the word said out loud">🔊 Hear it</button>
        <button class="btn ghost small" id="hint-btn" aria-label="Get a hint">💡 Hint</button>
        <button class="btn ghost small" id="clear-btn" aria-label="Clear all the letters">⌫ Clear</button>
        <button class="btn ghost small" id="skip-btn" aria-label="Skip this word for now">Skip ⏭</button>
        <button class="btn ghost small" id="quit-btn" aria-label="Back to the spellbook list">📚 Spellbooks</button>
      </div>

      <!-- WORD STUDY: the lesson you get for spelling it right -->
      <div class="study" id="study" hidden>
        <div class="study-art" id="study-art" aria-hidden="true"></div>
        <p class="study-word" id="study-word"></p>
        <p class="study-pos" id="study-pos">noun</p>
        <p class="study-def" id="study-def"></p>
        <p class="study-sentence" id="study-sentence"></p>
        <p class="study-tip" id="study-tip"></p>
        <div class="controls">
          <button class="btn" id="study-next">Next word ▶</button>
          <button class="btn ghost small" id="study-hear" aria-label="Hear the word said out loud">🔊 Hear it</button>
        </div>
      </div>
    </section>

    <!-- LEVEL COMPLETE -->
    <section id="win" class="hidden">
      <div class="big" id="win-big" aria-hidden="true">🏆</div>
      <h2 id="win-title">Spellbook mastered!</h2>
      <p id="win-text" style="font-size:1.2rem;color:#4d4668;"></p>
      <div class="win-stats" id="win-stats"></div>
      <div class="controls">
        <button class="btn" id="win-next">Next spellbook ▶</button>
        <button class="btn ghost" id="win-again">🔁 Play this book again</button>
        <button class="btn ghost" id="win-menu">📚 All spellbooks</button>
      </div>
    </section>

  </main>

  <script src="../../assets/js/sfx.js"></script>
  <script src="../../assets/js/confetti.js"></script>
  <script src="../../assets/js/voice.js"></script>
  <script src="../../assets/js/pixelsvg.js"></script>
  <script src="word-art.js"></script>
  <script src="word-wizard.js"></script>
</body>
</html>
