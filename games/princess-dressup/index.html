<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👑 Princess Dress-Up</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>" />
  <meta name="theme-color" content="#8a5cff" />
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <style>
    /* keep the whole game on one screen — a 3-year-old should never have
       to scroll to reach the buttons */
    .hero { padding: 0.4rem 1rem 0.2rem; }
    @media (max-width: 460px) {
      .title { font-size: 1.75rem; }
      .back-link { padding: 0.4rem 0.9rem; font-size: 0.95rem; }
      /* keep the score and both buttons on ONE row on a phone */
      .stars .wide { display: none; }
      .stars .narrow { display: inline; }
      .stars { font-size: 1.05rem; }
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 0.35rem;
    }
    .stars { font-size: 1.15rem; font-weight: bold; color: var(--purple); }
    .stars #stars { color: var(--pink); }
    .stars .narrow { display: none; }
    .icon-btn {
      font-size: 1.35rem;
      border: none;
      background: #fff;
      border-radius: 999px;
      width: 48px; height: 48px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(43,36,64,0.15);
    }
    .icon-btn:focus-visible { outline: 4px solid var(--purple); outline-offset: 2px; }

    .stage {
      max-width: 560px;
      margin: 0 auto;
      padding: 0 0.75rem 2rem;
      text-align: center;
    }

    /* ---------- the scene she twirls in ---------- */
    .scene {
      position: relative;
      width: min(320px, 88vw);
      margin: 0 auto 0.5rem;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 10px 26px rgba(43,36,64,0.16);
      background: linear-gradient(#cfeeff 0%, #e8f7ff 58%, #a4e690 58%, #6fcf67 100%);
    }
    .scene::before {           /* sun / moon / chandelier, per scene */
      content: "";
      position: absolute;
      top: 8%; right: 10%;
      width: 42px; height: 42px;
      border-radius: 50%;
      background: #ffe27a;
      box-shadow: 0 0 26px 10px rgba(255,226,122,0.55);
    }
    .scene::after {            /* a few floating specks of atmosphere */
      content: "";
      position: absolute; inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.95) 40%, transparent 42%),
        radial-gradient(circle, rgba(255,255,255,0.8) 40%, transparent 42%),
        radial-gradient(circle, rgba(255,255,255,0.7) 40%, transparent 42%);
      background-size: 7px 7px, 5px 5px, 4px 4px;
      background-position: 14% 22%, 82% 46%, 26% 70%;
      background-repeat: no-repeat;
    }
    .scene[data-scene="ballroom"] {
      background: linear-gradient(#f6e6ff 0%, #ecd6ff 58%, #c9a4ea 58%, #a97fd8 100%);
    }
    .scene[data-scene="ballroom"]::before {
      background: #fff3c4;
      box-shadow: 0 0 30px 12px rgba(255,243,196,0.7);
      top: 5%; right: 46%;
      width: 26px; height: 26px;
    }
    .scene[data-scene="sunset"] {
      background: linear-gradient(#ffe0b0 0%, #ffc0d0 40%, #ff9ec0 58%, #e97fae 100%);
    }
    .scene[data-scene="sunset"]::before {
      background: #fff0a8;
      box-shadow: 0 0 34px 14px rgba(255,204,120,0.6);
      top: 42%; right: 12%;
    }
    .scene[data-scene="night"] {
      background: linear-gradient(#2f2c6b 0%, #4a3f95 55%, #3b3078 55%, #262055 100%);
    }
    .scene[data-scene="night"]::before {
      background: #fff8dd;
      box-shadow: 0 0 26px 10px rgba(255,248,221,0.5);
      top: 7%; right: 12%;
      width: 34px; height: 34px;
    }

    /* ---------- the princess (vector SVG layers) ---------- */
    .princess {
      position: relative;
      margin: 0 auto;
      height: min(300px, 40vh);
      aspect-ratio: 165 / 218;   /* matches the art's viewBox */
      max-width: 100%;
    }
    .princess svg {
      position: absolute; inset: 0;
      width: 100% !important; height: 100% !important;
      overflow: visible;
    }
    .princess-base { z-index: 1; }
    .princess.twirl { animation: twirl 1.5s ease-in-out; }
    @keyframes twirl {
      0%   { transform: rotate(0) scale(1); }
      25%  { transform: rotate(-6deg) scale(1.05); }
      55%  { transform: rotate(7deg) scale(1.08); }
      80%  { transform: rotate(-3deg) scale(1.04); }
      100% { transform: rotate(0) scale(1); }
    }

    /* outfit pieces — each a full-frame sprite layer, hidden until earned */
    .acc {
      position: absolute; inset: 0; z-index: 2;
      opacity: 0; transform: scale(0.3);
      transition: opacity 0.4s ease, transform 0.45s cubic-bezier(.34,1.56,.64,1);
      pointer-events: none;
    }
    .acc.on { opacity: 1; transform: scale(1); }
    .acc[data-slot="wand"].on { transform: scale(1) rotate(7deg); }

    /* ---------- prompt ---------- */
    .prompt {
      background: rgba(255,255,255,0.88);
      border-radius: 22px;
      padding: 0.6rem 0.9rem;
      box-shadow: 0 8px 22px rgba(43,36,64,0.12);
      margin-bottom: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      min-height: 62px;
    }
    .prompt-label { font-size: 1.15rem; font-weight: bold; color: var(--purple); }
    #target-char {
      display: inline-block;
      font-size: 2.4rem;
      font-weight: 900;
      color: var(--pink);
      vertical-align: middle;
    }
    #target-char.word { font-size: 1.45rem; text-transform: capitalize; }
    #target-sample {
      display: inline-flex;
      width: 48px; height: 48px;
    }
    #target-sample[hidden] { display: none; }
    #target-sample svg { width: 100%; height: 100%; }

    /* ---------- the answer gems ---------- */
    .choices {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .gem {
      font-family: var(--font);
      width: clamp(72px, 20.5vw, 104px);
      height: clamp(72px, 20.5vw, 104px);
      border: none;
      border-radius: 24px;
      font-size: clamp(2.1rem, 8vw, 3rem);
      line-height: 1;
      font-weight: 900;
      color: #fff;
      cursor: pointer;
      padding: 0;
      box-shadow: inset 0 -6px 0 rgba(0,0,0,0.15), 0 8px 18px rgba(43,36,64,0.2);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.14s ease, opacity 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .gem:hover { transform: translateY(-4px) scale(1.04); }
    .gem:focus-visible { outline: 5px solid var(--purple); outline-offset: 3px; }
    .gem.two-char { font-size: clamp(1.5rem, 5.6vw, 2.2rem); }
    /* picture gems (colours & shapes) sit on cream so the art reads true */
    .gem.picture { background: #fffaf2; }
    .gem.picture svg { width: 76%; height: 76%; }
    /* counting gems: a tidy little array of dots to count */
    .gem .dots {
      display: flex; flex-wrap: wrap;
      align-items: center; justify-content: center;
      gap: 12%;
      width: 78%; height: 78%;
    }
    .gem .dots i {
      display: block;
      width: 19%; aspect-ratio: 1;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 0 rgba(0,0,0,0.18);
    }
    .gem.correct { animation: pop 0.45s ease; }
    @keyframes pop { 0%{transform:scale(1);} 50%{transform:scale(1.18);} 100%{transform:scale(1);} }
    .gem.wrong { animation: wobble 0.45s ease; }
    @keyframes wobble { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-9px) rotate(-4deg);} 75%{transform:translateX(9px) rotate(4deg);} }

    /* after two misses the right gem softly glows to help little fingers */
    .gem.hint { animation: hint-glow 0.9s ease infinite; }
    @keyframes hint-glow {
      0%, 100% { box-shadow: inset 0 -6px 0 rgba(0,0,0,0.15), 0 8px 18px rgba(43,36,64,0.2); transform: scale(1); }
      50% { box-shadow: inset 0 -6px 0 rgba(0,0,0,0.15), 0 0 0 8px #ffd23f88, 0 8px 22px rgba(43,36,64,0.25); transform: scale(1.08); }
    }
    /* after three misses the wrong gems step aside — never a dead end */
    .gem.faded { opacity: 0.18; pointer-events: none; }

    /* outfit progress: one little icon per piece, lit up when earned */
    .outfit-progress {
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      margin: 0 0 0.35rem;
    }
    .op-item {
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.35rem;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(43,36,64,0.12);
      opacity: 0.35;
      filter: grayscale(1);
      transition: opacity 0.3s ease, filter 0.3s ease, transform 0.35s cubic-bezier(.34,1.56,.64,1);
    }
    .op-item.done {
      opacity: 1;
      filter: none;
      background: #fff5d6;
      transform: scale(1.12);
    }

    /* praise word that pops up over the princess */
    .praise-pop {
      position: absolute;
      left: 50%; top: 34%;
      transform: translate(-50%, 0);
      font-family: var(--font);
      font-weight: 900;
      font-size: 2rem;
      color: var(--pink);
      text-shadow: 0 2px 0 #fff, 0 4px 12px rgba(43,36,64,0.3);
      pointer-events: none;
      white-space: nowrap;
      z-index: 6;
      animation: praise-rise 0.9s ease-out forwards;
    }
    @keyframes praise-rise {
      0%   { opacity: 0; transform: translate(-50%, 14px) scale(0.5); }
      25%  { opacity: 1; transform: translate(-50%, 0) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -50px) scale(1); }
    }

    /* a gentle nudge on the target if she's been thinking a while */
    .nudge { animation: char-wiggle 0.7s ease; }
    @keyframes char-wiggle {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-8deg) scale(1.15); }
      75% { transform: rotate(8deg) scale(1.15); }
    }

    .overlay-stars { margin: 0; font-size: 1.4rem; color: var(--purple); font-weight: bold; min-height: 1em; }

    /* ---------- overlay: the dressing room ---------- */
    .overlay {
      position: fixed; inset: 0; z-index: 20;
      display: flex; align-items: flex-start; justify-content: center;
      text-align: center;
      overflow-y: auto;
      background: rgba(255,255,255,0.94); backdrop-filter: blur(3px);
    }
    .overlay.hidden { display: none; }
    .overlay-card {
      display: flex; flex-direction: column; align-items: center;
      gap: 0.7rem;
      padding: 1.25rem 1rem 2rem;
      margin: auto;
      max-width: 460px;
      width: 100%;
    }
    .overlay h2 { font-size: 1.9rem; margin: 0; color: var(--purple); }
    .overlay p { margin: 0; }
    .overlay .big { font-size: 3.4rem; line-height: 1; }

    .picker { width: 100%; }
    .picker-title {
      font-size: 1.05rem; font-weight: bold; color: var(--ink);
      margin-bottom: 0.35rem;
    }
    .swatches {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem;
    }
    .swatch {
      width: 54px; height: 54px;
      border-radius: 50%;
      border: 4px solid #fff;
      cursor: pointer;
      padding: 0;
      font-size: 1.5rem;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(43,36,64,0.2);
      transition: transform 0.15s ease;
    }
    .swatch:hover { transform: scale(1.08); }
    .swatch:focus-visible { outline: 4px solid var(--purple); outline-offset: 2px; }
    .swatch.picked { border-color: var(--purple); transform: scale(1.14); }
    .swatch.locked { filter: grayscale(1); opacity: 0.45; box-shadow: none; }
    .swatch.locked::after { content: "✨"; font-size: 1.2rem; }
    .swatch.shake { animation: wobble 0.45s ease; }
    .swatch-scene { background: #fff; }

    .btn {
      font-family: var(--font); font-size: 1.3rem; font-weight: bold; color: #fff;
      background: linear-gradient(90deg, var(--pink), var(--purple));
      border: none; border-radius: 999px; padding: 0.9rem 2.2rem; cursor: pointer;
      box-shadow: 0 8px 20px rgba(138,92,255,0.3); transition: transform 0.15s ease;
      margin-top: 0.3rem;
    }
    .btn:hover { transform: scale(1.05); }
    .btn:focus-visible { outline: 5px solid var(--purple); outline-offset: 3px; }

    /* calm mode: keep every reward, drop every wobble */
    @media (prefers-reduced-motion: reduce) {
      .acc, .gem, .op-item, .swatch, .btn { transition: none; }
      .acc { transform: none; }
      .gem.correct, .gem.wrong, .gem.hint, .nudge, .swatch.shake,
      .praise-pop, .princess.twirl { animation: none; }
      .praise-pop { opacity: 1; }
      .princess svg animate,
      .princess svg animateTransform { display: none; }
    }
  </style>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <a class="back-link" href="../../">← Back to the Arcade</a>

  <header class="hero">
    <h1 class="title"><span class="emo">👑</span> Princess Dress-Up</h1>
  </header>

  <div class="stage">
    <div class="topbar">
      <div class="stars"><span class="wide">Princesses dressed:</span><span class="narrow">Dressed:</span> <span id="stars">0</span> ⭐</div>
      <button class="icon-btn" id="wardrobe-btn" aria-label="Open the dressing room">👗</button>
      <button class="icon-btn" id="mute" aria-label="Turn sound on or off" aria-pressed="false">🔊</button>
    </div>

    <div class="outfit-progress" id="progress" aria-label="Outfit pieces earned"></div>

    <div class="scene" id="scene" data-scene="garden">
      <div class="princess" id="princess" aria-hidden="true"><!-- vector art built by princess-art.js --></div>
    </div>

    <div class="prompt" aria-live="polite">
      <span class="prompt-label" id="prompt-label">Tap the matching one!</span>
      <span id="target-char">?</span>
      <span id="target-sample" hidden aria-hidden="true"></span>
    </div>

    <div class="choices" id="choices"></div>
  </div>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <div class="overlay-card">
      <div class="big" id="overlay-emoji">👸✨</div>
      <h2 id="overlay-title">Let's dress a princess!</h2>
      <p id="overlay-text">Find the letters, numbers, colours and shapes to give her a crown, a wand, and more!</p>
      <p class="overlay-stars" id="overlay-stars"></p>

      <div class="picker">
        <div class="picker-title" id="gown-title">👗 Pick her gown</div>
        <div class="swatches" id="wardrobe" role="group" aria-labelledby="gown-title"></div>
      </div>

      <div class="picker">
        <div class="picker-title" id="scene-title">🏰 Pick where she twirls</div>
        <div class="swatches" id="scene-picker" role="group" aria-labelledby="scene-title"></div>
      </div>

      <button class="btn" id="start-btn">Start ▶</button>
    </div>
  </div>

  <script src="../../assets/js/sfx.js"></script>
  <script src="../../assets/js/confetti.js"></script>
  <script src="../../assets/js/voice.js"></script>
  <script src="princess-art.js"></script>
  <script src="princess.js"></script>
</body>
</html>
