<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>👶 Baby Taps</title>
  <meta name="description" content="A first game for the littlest one — tap giant shapes and animals, hear their names, and watch them pop. Colours, shapes, animal sounds and first words." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👶</text></svg>" />
  <meta name="theme-color" content="#ffd166" />
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <style>
    /* Everything here is deliberately BIG and forgiving: no timer, no
       score to lose, no small buttons, nothing that can go wrong. */
    body { overflow: hidden; }

    .word-line {
      text-align: center;
      font-size: clamp(2rem, 9vw, 3.4rem);
      font-weight: 900;
      color: var(--purple);
      margin: 0.1rem 0 0.2rem;
      min-height: 1.15em;
      line-height: 1.15;
      text-shadow: 0 3px 0 #fff, 0 6px 18px rgba(138, 92, 255, 0.2);
    }

    #pit {
      position: relative;
      height: 72vh;
      min-height: 340px;
      margin: 0 0.5rem;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.5);
      box-shadow: inset 0 0 0 5px rgba(255, 209, 102, 0.5);
      overflow: hidden;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    .thing {
      position: absolute;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop-in 0.35s ease backwards;
      will-change: transform;
    }
    @keyframes pop-in {
      from { transform: scale(0.2); opacity: 0; }
    }
    .thing:active { transform: scale(0.9); }
    .thing.gone {
      animation: pop-out 0.4s ease forwards;
      pointer-events: none;
    }
    @keyframes pop-out {
      to { transform: scale(1.9) rotate(12deg); opacity: 0; }
    }
    .thing .face { font-size: 4.6rem; line-height: 1; filter: drop-shadow(0 6px 8px rgba(0,0,0,0.16)); }
    .thing svg { display: block; filter: drop-shadow(0 6px 8px rgba(0,0,0,0.18)); }

    /* Things breathe instead of drifting: a baby's aim is wobbly enough
       without a moving target, so the hit area never moves — only the glow. */
    @media (prefers-reduced-motion: no-preference) {
      .thing.bob { animation: pop-in 0.35s ease backwards, breathe 3.4s ease-in-out infinite 0.35s; }
      @keyframes breathe {
        0%, 100% { filter: drop-shadow(0 6px 8px rgba(0,0,0,0.16)); }
        50%      { filter: drop-shadow(0 10px 16px rgba(138, 92, 255, 0.45)); }
      }
    }

    .spark {
      position: absolute;
      font-size: 1.8rem;
      pointer-events: none;
      animation: spark-up 0.7s ease-out forwards;
    }
    @keyframes spark-up {
      0%   { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
      100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.4); }
    }

    /* grown-up strip: mode + count, small on purpose so babies miss it */
    .grown-ups {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0.2rem 0 0.35rem;
    }
    .mode-btn {
      font-family: var(--font);
      font-size: 0.92rem;
      font-weight: bold;
      color: var(--purple);
      background: var(--paper);
      border: 3px solid var(--yellow);
      border-radius: 14px;
      padding: 0.3rem 0.7rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    .mode-btn[aria-pressed="true"] {
      color: #fff;
      background: linear-gradient(90deg, var(--yellow), var(--pink));
      border-color: var(--pink);
    }
    .count {
      font-weight: bold;
      color: var(--pink);
      font-size: 0.95rem;
      padding: 0 0.4rem;
    }
  </style>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <a class="back-link" href="../../" style="margin: 0.5rem 0.75rem;">← Back to the Arcade</a>

  <p class="word-line" id="word" aria-live="polite">Tap anything! 👶</p>

  <div class="grown-ups" id="grown-ups">
    <button class="mode-btn" data-mode="shapes"  aria-pressed="true">🔵 Shapes &amp; Colours</button>
    <button class="mode-btn" data-mode="animals" aria-pressed="false">🐮 Animals</button>
    <button class="mode-btn" data-mode="mix"     aria-pressed="false">🌈 Everything</button>
    <button class="mode-btn" id="voice-btn" aria-pressed="true" aria-label="Say the words out loud">🔊 Words</button>
    <span class="count" id="count">0 pops</span>
  </div>

  <div id="pit"></div>

  <script src="../../assets/js/confetti.js"></script>
  <script src="baby-taps.js"></script>
</body>
</html>
