<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧶 Word Strands</title>
  <meta name="description" content="Trace the hidden theme words in a letter grid — every letter belongs to a word. 27 hunts about science, geography, myths and more, each word with its own meaning." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧶</text></svg>" />
  <meta name="theme-color" content="#8a5cff" />
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <style>
    .btn {
      font-family: var(--font); font-size: 1.1rem; font-weight: bold; color: #fff;
      background: linear-gradient(90deg, var(--blue), var(--purple));
      border: none; border-radius: 999px; padding: 0.7rem 1.5rem; cursor: pointer;
      box-shadow: 0 8px 20px rgba(56,182,255,0.35); transition: transform 0.15s ease; touch-action: manipulation;
      min-height: 48px;
    }
    .btn:hover { transform: scale(1.05); }
    .btn.ghost { background: var(--paper); color: #2f6ea8; box-shadow: 0 6px 16px rgba(43,36,64,0.12); }

    /* picker */
    #puzzles.hidden, #play.hidden, .hidden { display: none !important; }

    .stats-bar {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem;
      max-width: 620px; margin: 0 auto 0.8rem;
    }
    .stat {
      background: var(--paper); border-radius: 999px; padding: 0.4rem 0.9rem;
      font-weight: bold; color: #514a6b; font-size: 0.95rem;
      box-shadow: 0 5px 14px rgba(43,36,64,0.1);
    }
    .stat b { color: var(--purple); font-size: 1.05rem; }

    .daily {
      display: inline-flex; align-items: center; gap: 0.5rem; margin: 0 auto 0.9rem;
      background: linear-gradient(90deg, #f7b733, #fc9d3b); color: #fff;
      border: none; border-radius: 999px; padding: 0.6rem 1.2rem; cursor: pointer;
      font-family: var(--font); font-weight: bold; font-size: 1.02rem; min-height: 48px;
      box-shadow: 0 8px 20px rgba(252,157,59,0.4); touch-action: manipulation;
    }
    .daily:hover { transform: scale(1.04); }

    .tier-tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.4rem; margin: 0 auto 1rem; }
    .tier-tab {
      font-family: var(--font); font-weight: bold; font-size: 0.95rem; cursor: pointer;
      background: var(--paper); color: #514a6b; border: 3px solid transparent;
      border-radius: 999px; padding: 0.45rem 0.95rem; min-height: 44px; touch-action: manipulation;
      box-shadow: 0 4px 12px rgba(43,36,64,0.1);
    }
    .tier-tab[aria-selected="true"] { border-color: var(--purple); color: var(--purple); }

    .puz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap: 1.1rem; max-width: 720px; margin: 0 auto; }
    .puz-card {
      position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
      background: var(--paper); border: 4px solid transparent; border-radius: 22px;
      padding: 1.3rem 1rem; cursor: pointer; box-shadow: 0 10px 26px rgba(43,36,64,0.12);
      transition: transform 0.15s ease, border-color 0.15s ease; font-family: var(--font); color: var(--ink); text-align: center;
    }
    .puz-card:hover, .puz-card:focus-visible { transform: translateY(-6px); border-color: var(--blue); outline: none; }
    .puz-card .pz-emoji { font-size: 2.6rem; }
    .puz-card h3 { margin: 0; font-size: 1.1rem; }
    .puz-card .pz-progress { font-size: 0.85rem; color: #5b5478; font-weight: bold; }
    .puz-card .pz-tier { font-size: 0.75rem; font-weight: bold; color: #6f6790; letter-spacing: 0.03em; }
    .puz-card .pz-bar { width: 82%; height: 7px; border-radius: 999px; background: #e9e6f2; overflow: hidden; }
    .puz-card .pz-bar span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--blue), var(--purple)); }
    .puz-card.done { border-color: var(--green); }
    .puz-card .pz-badge { position: absolute; top: 6px; right: 8px; font-size: 1.15rem; }
    .puz-card .pz-today { position: absolute; top: 6px; left: 8px; font-size: 1.15rem; }

    /* phones: two compact columns instead of one giant card per row */
    @media (max-width: 520px) {
      .puz-grid { grid-template-columns: 1fr 1fr; gap: 0.7rem; }
      .puz-card { padding: 0.9rem 0.5rem; border-radius: 18px; gap: 0.2rem; }
      .puz-card .pz-emoji { font-size: 2.1rem; }
      .puz-card h3 { font-size: 0.98rem; }
      .stat { font-size: 0.85rem; padding: 0.35rem 0.7rem; }
    }

    .clue-card {
      max-width: 460px; margin: 0 auto 0.5rem; background: var(--paper); border-radius: 18px;
      padding: 0.7rem 1rem; box-shadow: 0 8px 20px rgba(43,36,64,0.12);
    }
    .clue-card .ttl { font-weight: bold; color: var(--purple); font-size: 1.15rem; }
    .clue-card .cl { color: #5b5478; font-size: 0.98rem; }
    .clue-card .tier-pill { display: inline-block; font-size: 0.78rem; font-weight: bold; color: #6f6790; }

    .progress-line { font-size: 1.05rem; font-weight: bold; color: #2f6ea8; margin: 0.2rem 0; }
    .how-to { font-size: 0.82rem; color: #5b5478; margin: 0.1rem 0 0.3rem; }
    .feedback { min-height: 1.6rem; font-size: 1.1rem; font-weight: bold; color: #157a45; margin: 0.35rem 0 0.2rem; }

    /* board */
    .board-wrap {
      position: relative; width: 340px; max-width: 94vw; margin: 0.4rem auto 0.6rem;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .board { display: grid; gap: 0.35rem; position: relative; z-index: 2; }
    .lines { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    .scell {
      aspect-ratio: 1/1; border: 3px solid transparent; border-radius: 50%; background: rgba(255,255,255,0.9);
      color: var(--ink); font-family: var(--font); font-weight: bold; font-size: clamp(1rem,4.4vw,1.6rem);
      text-transform: uppercase; cursor: pointer; box-shadow: 0 3px 8px rgba(43,36,64,0.12);
      display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none;
      -webkit-tap-highlight-color: transparent; padding: 0;
      transition: transform 0.08s ease, background 0.12s ease, color 0.12s ease;
    }
    .scell:focus-visible { outline: 4px solid var(--purple); outline-offset: 2px; }
    .scell.sel { background: #6b3fd6; color: #fff; transform: scale(1.06); }
    .scell.found { color: #fff; cursor: default; }
    .scell.found.span { border-color: #f4b400; box-shadow: 0 0 0 3px rgba(244,180,0,0.45), 0 3px 8px rgba(43,36,64,0.2); }
    .scell.pop { animation: cellPop 0.42s ease; }
    @keyframes cellPop { 0%{transform:scale(1);} 45%{transform:scale(1.22);} 100%{transform:scale(1);} }
    .board.shake { animation: boardShake 0.34s ease; }
    @keyframes boardShake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-7px);} 75%{transform:translateX(7px);} }

    /* the "what it means" card — sits BELOW the board so finding a word
       never shoves the grid around under a kid's finger */
    .learn {
      max-width: 460px; min-height: 4.1rem; margin: 0 auto 0.6rem; text-align: left;
      background: var(--paper); border-radius: 16px; padding: 0.6rem 0.9rem;
      box-shadow: 0 8px 20px rgba(43,36,64,0.12); border-left: 8px solid var(--purple);
    }
    .learn.empty { opacity: 0.45; border-left-color: #ccc7dd; }
    .learn .lw { font-weight: bold; font-size: 1.05rem; color: var(--purple); }
    .learn .ld { font-size: 0.95rem; color: #443d5e; line-height: 1.35; }

    .controls { display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; }
    .controls .btn { font-size: 1rem; padding: 0.6rem 1.1rem; }

    .found-list { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; max-width: 520px; margin: 0.8rem auto 0; }
    .found-chip {
      background: var(--paper); border: none; border-radius: 999px; padding: 0.45rem 0.9rem;
      font-family: var(--font); font-weight: bold; font-size: 0.95rem; color: var(--ink);
      box-shadow: 0 4px 10px rgba(43,36,64,0.1); cursor: pointer; min-height: 40px;
      touch-action: manipulation;
    }
    .found-chip:hover { transform: scale(1.05); }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .btn, .puz-card, .scell, .found-chip, .daily { transition: none !important; }
      .btn:hover, .puz-card:hover, .found-chip:hover, .daily:hover { transform: none !important; }
      .scell.sel { transform: none; }
      .scell.pop, .board.shake { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-1"></span><span class="blob blob-2"></span><span class="blob blob-3"></span>
  </div>

  <a class="back-link" href="../../">← Back to the Arcade</a>

  <header class="hero" style="padding-top: 0.5rem;">
    <h1 class="title"><span class="emo">🧶</span> Word Strands</h1>
    <p class="subtitle">Trace the hidden words! Every letter belongs to one — find them all.</p>
  </header>

  <main class="game-stage" style="max-width: 700px;">

    <section id="puzzles">
      <div class="stats-bar" id="stats-bar"></div>
      <button class="daily" id="daily-btn" type="button"></button>
      <div class="tier-tabs" id="tier-tabs" role="tablist" aria-label="Difficulty"></div>
      <p style="font-weight:bold;color:#2f6ea8;font-size:1.15rem;margin:0 0 0.6rem;">Pick a word hunt:</p>
      <div class="puz-grid" id="puz-grid"></div>
    </section>

    <section id="play" class="hidden">
      <div class="clue-card">
        <div class="ttl" id="puz-title">…</div>
        <div class="cl" id="puz-clue">…</div>
        <div class="tier-pill" id="puz-tier"></div>
      </div>
      <div class="progress-line" id="progress" aria-live="polite"></div>
      <p class="how-to">Drag across touching letters, tap them one by one, or use the arrow keys and Enter.</p>

      <div class="board-wrap" id="board-wrap">
        <svg class="lines" id="lines" aria-hidden="true"></svg>
        <div class="board" id="board" role="group" aria-label="Letter grid"></div>
      </div>

      <p class="feedback" id="feedback" aria-live="polite"></p>

      <div class="learn empty" id="learn">
        <span class="lw" id="learn-word"></span>
        <span class="ld" id="learn-def">Find a word to learn what it means.</span>
      </div>

      <div class="controls">
        <button class="btn hidden" id="next-btn">Next hunt ▶</button>
        <button class="btn ghost hidden" id="again-btn">🔄 Play again</button>
        <button class="btn ghost" id="clear-btn">✋ Clear</button>
        <button class="btn ghost" id="hint-btn">💡 Hint</button>
        <button class="btn ghost" id="quit-btn">🧶 All hunts</button>
      </div>

      <div class="found-list" id="found-list"></div>
    </section>

  </main>

  <script src="../../assets/js/sfx.js"></script>
  <script src="../../assets/js/confetti.js"></script>
  <script src="strands.js"></script>
</body>
</html>
